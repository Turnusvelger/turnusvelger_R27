el=s=>new Date(s+'T12:00:00Z').toLocaleDateString('nb-NO',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});\nconst HOLIDAYS=new Set(['2026-12-25','2026-12-26','2027-01-01','2027-03-25','2027-03-26','2027-03-27','2027-03-29','2027-05-01','2027-05-06','2027-05-17']);\nfunction entry(d){let n=dayNumber(d);if(n<0||d>endUTC)return null;let w=(state.start-1+Math.floor(n/7))%DATA[state.roster-1].length;return {...DATA[state.roster-1][w][n%7],week:w+1}}\nfunction isFree(e){return ['O','X','T'].includes(e.code)||(state.hfree&&e.code.includes('H'))}\nfunction onVacation(d){let s=iso(d);return state.vacations.some(v=>v.from<=s&&s<=v.to)}\nfunction dag2Fri(d){return d>startUTC&&onVacation(d-MS)}\nfunction dag2FriFor(d){return d>startUTC&&onVacation(d-MS)}\nfunction render(){let html='',off=0,work=0,h=0,vac=0,redFree=0;for(let d=startUTC;d<=endUTC;d+=MS){let e=entry(d);let free=isFree(e)||(e.code==='Dag2'&&dag2Fri(d)),holiday=onVacation(d);if(free||holiday)off++;else work++;if(e.code.includes('H'))h++;if(holiday)vac++;if(HOLIDAYS.has(iso(d))&&iso(d)!=='2027-03-28'&&isFree(e))redFree++}\n$('daysOff').textContent=off;$('workDays').textContent=work;$('vacDays').textContent=vac;$('hDays').textContent=h;$('redFreeDays').textContent=redFree;\nfor(let monthIndex=0;monthIndex<13;monthIndex++){let year=monthIndex===0?2026:2027,month=monthIndex===0?11:monthIndex-1;let first=Date.UTC(year,month,1),last=Date.UTC(year,month+1,0);let title=new Date(first).toLocaleDateString('nb-NO',{month:'long',year:'numeric',timeZone:'UTC'});html+='<article class=\"month\"><h3>'+title[0].toUpperCase()+title.slice(1)+'</h3><div class=\"weekdays\">'+['M','T','O','T','F','L','S'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class=\"days\">';let offset=(new Date(first).getUTCDay()+6)%7;for(let k=0;k<offset;k++)html+='<div class=\"cell empty\"></div>';for(let d=first;d<=last;d+=MS){let e=entry(d);if(!e){html+='<div class=\"cell empty\"></div>';continue}let free=isFree(e)||(e.code==='Dag2'&&dag2Fri(d)),v=onVacation(d),s=iso(d),shownCode=(e.code==='Dag2'&&dag2Fri(d)?'Fri':e.code);html+='<div role=\"button\" tabindex=\"0\" class=\"cell '+(free?'off ':'')+(v?'vacation ':'')+(HOLIDAYS.has(s)?'holiday':'')+'\" data-date=\"'+s+'\" title=\"'+s+' · '+shownCode+' '+e.time+(e.shifts?' · '+e.shifts[1].code+' '+e.shifts[1].time:'')+'\"><div class=\"num\">'+new Date(d).getUTCDate()+'</div><div class=\"code '+(e.code.includes('R')?'r-duty':'')+'\">'+shownCode+'</div><div class=\"time\">'+e.time+'</div>'+(e.shifts&&e.shifts.length>1?e.shifts.slice(1).map(sh=>'<div class=\"code second-shift\">'+sh.code+'</div><div class=\"time second-time\">'+sh.time+'</div>').join(''):'')+(v?'<span class=\"badge\">Ferie</span>':'')+'</div>'}html+='</div></article>'} $('months').innerHTML=html;\n$('vaclist').innerHTML=state.vacations.length?state.vacations.map((v,i)=>'<span class=\"vacitem\">'+dateLabel(v.from)+' – '+dateLabel(v.to)+' <button aria-label=\"Slett ferie\" data-remove=\"'+i+'\">×</button></span>').join(''):'<span class=\"muted\">Ingen ferie registrert ennå.</span>';\n}\nfor(let i=1;i<=1;i++)$('roster').add(new Option('Turnus '+i,i));function syncStartWeeks(){let el=$('start'),n=DATA[state.roster-1].length;el.innerHTML='';for(let i=1;i<=n;i++)el.add(new Option('Uke '+i,i));if(state.start>n)state.start=1;el.value=state.start;}syncStartWeeks();$('roster').value=state.roster;$('start').value=state.start;$('hfree').checked=state.hfree;\n$('roster').onchange=e=>{state.roster=+e.target.value;syncStartWeeks();save();render()};$('start').onchange=e=>{state.start=+e.target.value;save();render()};$('hfree').onchange=e=>{state.hfree=e.target.checked;save();render()};\n$('addvac').onclick=()=>{let a=$('from').value,b=$('to').value;if(!a||!b||a>b||a<'2026-12-14'||b>'2027-12-12'){alert('Velg gyldige datoer innenfor turnusåret.');return}state.vacations.push({from:a,to:b});state.vacations.sort((a,b)=>a.from.localeCompare(b.from));save();render()};\n$('clearvac').onclick=()=>{if(confirm('Vil du :hm(get('earlyLimit').value)??420,late:hm(get('lateLimit').value)??840,nightFrom:hm(get('nightFrom').value)??80,nightTo:hm(get('nightTo').value)??285}}\nfunction coversNight(a,b,from,to){if(a===null||b===null||from===to)return false;let end=b<=a?b+1440:b;for(let k=-1;k<=1;k++){let start=from+k*1440,finish=to+k*1440+(to<=from?1440:0);if(a<=start&&end>=finish)return true}return false}\nconst nightSettingsKey='turnusvelger-r27-mosjoen-night-range';try{let z=JSON.parse(localStorage.getItem(nightSettingsKey)||'null');if(z&&/^([01]\\d|2[0-3]):[0-5]\\d$/.test(z.from)&&/^([01]\\d|2[0-3]):[0-5]\\d$/.test(z.to)){get('nightFrom').value=z.from;get('nightTo').value=z.to}}catch(e){}\nfunction analyze(roster,week){let r={off:0,work:0,comp:0,h:0,early:0,late:0,night:0,rDuty:0,weekendWork:0,weekendFree:0,markedFree:0,markedTotal:state.important.length};let {early,late,nightFrom,nightTo}=limits();let weekends={};for(let d of allDates){let e=datum(roster,week,d),f=free(e),v=vacation(d),s=iso(d);if(f||v||(e.code==='Dag2'&&dag2FriFor(d)))r.off++;else r.work++;if(e.code.includes('H'))r.h++;if(HOLIDAYS.has(s)&&f)r.comp++;if(state.important.some(m=>m.date===s)&&(f||v))r.markedFree++;\nlet wd=new Date(d).getUTCDay();if(wd===6||wd===0){let monday=d-((wd+6)%7)*dayMs;let key=iso(monday);if(!weekends[key])weekends[key]=0;if(duty(e,d))weekends[key]++}\nif(duty(e,d)){let times=e.time.split('-');if(times.length===2){let a=hm(times[0]),b=hm(times[1]);if(a<early)r.early++;if(a>=late)r.late++;if(e.code!=='527177A' && coversNight(a,b,nightFrom,nightTo))r.night++}if(e.code.includes('R'))r.rDuty++}}\nfor(let count of Object.values(weekends)){if(count)r.weekendWork++;else r.weekendFree++}return r}\nfunction metric(label,n){return '<span class=\"mini-stat\"><b>'+safe(label)+':</b> '+n+'</span>'}\nfunction fillSelect(id,n,label){let el=get(id);for(let i=1;i<=n;i++)el.add(new Option(label+i,i))}\nfillSelect('cmpRosterA',1,'Turnus ');fillSelect('cmpRosterB',1,'Turnus ');fillSelect('cmpWeekA',8,'Uke ');fillSelect('cmpWeekB',8,'Uke ');\nget('cmpRosterA').value=state.roster;get('cmpWeekA').value=state.start;get('cmpRosterB').value=1;get('cmpWeekB').value=state.start; if(+get('cmpWeekB').value>DATA[+get('cmpRosterB').value-1].length)get('cmpWeekB').value='1';\nfunction isoWeek(d){let x=new Date(d);x.setUTCHours(0,0,0,0);x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));let year=x.getUTCFullYear();let first=Date.UTC(year,0,1);return {year,week:Math.ceil((((x-first)/dayMs)+1)/7)}}\nfunction weekOverview(roster,week){let h='';for(let d=startUTC;d<=endUTC;d+=7*dayMs){let wn=isoWeek(d),n=dayNumber(d),rw=(week-1+Math.floor(n/7))%DATA[roster-1].length+1;h+='<div style=\"margin:9px 0 4px;font-size:12px\"><b>Kalenderuke '+wn.week+'/'+wn.year+'</b> · turnusuke '+rw+'</div><div class=\"week-grid\">';for(let k=0;k<7;k++){let dt=d+k*dayMs,e=datum(roster,week,dt),s=iso(dt),mark=state.important.some(m=>m.date===s);h+='<div class=\"wkday '+(free(e)?'off ':'')+(vacation(dt)?'vacation ':'')+(HOLIDAYS.has(s)?'holiday ':'')+(e.code.includes('R')?'r-duty':'')+'\" title=\"'+safe(s+' '+e.code+' '+e.time)+'\" '+(mark?'style=\"outline:2px solid #8a50be\"':'')+'>'+new Date(dt).getUTCDate()+'.'+(new Date(dt).getUTCMonth()+1)+'<br><b>'+safe(e.code)+'</b>'+(e.shifts&&e.shifts.length>1?e.shifts.slice(1).map(sh=>'<br><b>'+safe(sh.code)+'</b>').join(''):'')+'</div>'}h+='</div>'}return h}\nfunction comparison(){for(let side of ['A','B']){let r=+get('cmpRoster'+side).value,w=get('cmpWeek'+side),limit=DATA[r-1].length;for(let o of w.options)o.disabled=+o.value>limit;if(+w.value>limit)w.value='1'}let a=+get('cmpRosterA').value,aw=+get('cmpWeekA').value,b=+get('cmpRosterB').value,bw=+get('cmpWeekB').value,x=analyze(a,aw),y=analyze(b,bw);let names=[['Vaktdager','work'],['Fridager','off'],['Kompdager','comp'],['H-dager','h'],['Arbeidshelger','weekendWork'],['Frihelger','weekendFree'],['Tidligvakter','early'],['Senvakter','late'],['Nattvakter','night'],['R-vakter','rDuty'],['Private merkedager fri','markedFree']
