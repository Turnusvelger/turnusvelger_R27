ch3>🌙 Natt- og helgetillegg\u003c/h3>\u003cp>Nattillegg: \u003cb>'+fmt(totals[0])+' timer\u003c/b> · Helgetillegg: \u003cb>'+fmt(totals[1])+' timer\u003c/b>\u003c/p>\u003cp class=\"hint\">Nattillegg 20:00–06:00. Helgetillegg fredag 20:00–mandag 05:00. Overlapp teller i begge kategorier. Beregnet fra vaktenes klokkeslett.\u003c/p>\u003ctable class=\"comparison-table\">\u003cthead>\u003ctr>\u003cth>Måned (vaktstart)\u003c/th>\u003cth>Natt\u003c/th>\u003cth>Helg\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+Object.entries(months).sort().map(([m,v])=>'\u003ctr>\u003ctd>'+m+'\u003c/td>\u003ctd>'+fmt(v[0])+'\u003c/td>\u003ctd>'+fmt(v[1])+'\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>';\n}\nlet stats=document.getElementById('extra-stats');if(stats){let el=document.createElement('div');el.id='mosjoen-premiums';el.style.marginTop='18px';stats.appendChild(el)}\n// Stats panel may be named differently in older versions.\nif(!document.getElementById('mosjoen-premiums')){let el=document.createElement('div');el.id='mosjoen-premiums';(document.getElementById('extraStats')||document.getElementById('extra-stats')||document.body).after(el)}\ndocument.getElementById('start').addEventListener('change',()=>setTimeout(count,0));\ndocument.getElementById('roster').addEventListener('change',()=>setTimeout(count,0));\ndocument.addEventListener('click',()=>setTimeout(count,0));count();\n})();\n\u003c/script>\n\u003cstyle id=\"iso-week-column-style\">\n/* Ukenummer gjelder bare minikalenderen i årsoversikten. */\n#months .month .weekdays, #months .month .days {grid-template-columns: minmax(24px,0.65fr) repeat(7,minmax(0,1fr));}\n#months .month .weekdays .week-number-head {font-weight:700;color:#52677e;}\n#months .month .days .iso-week-number {display:flex;align-items:flex-start;justify-content:center;padding:6px 1px;min-width:0;background:#e8f0f8;border-radius:5px;color:#36516d;font-size:11px;font-weight:750;cursor:default;}\n@media(max-width:640px){#months .month .weekdays,#months .month .days{grid-template-columns:minmax(26px,.65fr) repeat(7,minmax(0,1fr));}}\n\u003c/style>\n\u003cscript>\n(function(){\n  'use strict';\n  const root=document.getElementById('months');\n  if(!root)return;\n  function isoWeek(date){\n    const d=new Date(date.getTime());\n    d.setUTCHours(0,0,0,0);\n    d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));\n    const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));\n    return Math.ceil((((d-y)/86400000)+1)/7);\n  }\n  function addWeekNumbers(){\n    const months=root.querySelectorAll('.month');\n    months.forEach((month,index)=>{\n      const header=month.querySelector('.weekdays');\n      const days=month.querySelector('.days');\n      if(!header||!days||header.querySelector('.week-number-head'))return;\n      const head=document.createElement('span');head.className='week-number-head';head.textContent='Uke';\n      header.insertBefore(head,header.firstChild);\n      const cells=Array.from(days.children);\n      const year=index===0?2026:2027, monthNo=index===0?11:index-1;\n      const first=new Date(Date.UTC(year,monthNo,1));\n      const offset=(first.getUTCDay()+6)%7;\n      const firstMonday=Date.UTC(year,monthNo,1-offset);\n      for(let row=0;row\u003cMath.ceil(cells.length/7);row++){\n        const week=document.createElement('div');\n        week.className='iso-week-number';\n        week.textContent=String(isoWeek(new Date(firstMonday+row*7*86400000)));\n        week.setAttribute('aria-label','Uke '+week.textContent);\n        days.insertBefore(week,cells[row*7]||null);\n      }\n    });\n  }\n  let scheduled=false;\n  const observer=new MutationObserver(()=>{\n    if(scheduled)return;\n    scheduled=true;\n    queueMicrotask(()=>{scheduled=false;observer.disconnect();try{addWeekNumbers()}finally{observer.observe(root,{childList:true})}});\n  });\n  addWeekNumbers();\n  observer.observe(root,{childList:true});\n})();\n\u003c/script>\n\u003c/body>\u003c/html>","Åndalsnes":"\u003c!doctype html>\u003chtm l .time{font-size:8px}.print-only{display:block}.month h3{font-size:13px}body{background:white} @page{size:A4 landscape;margin:9mm}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ch1>🚆 Turnusvelger R27 · Åndalsnes\u003c/h1>\u003cp>1 turnus · 6 startuker · 14.12.2026–12.12.2027\u003c/p>\u003c/header>\u003cmain class=\"wrap\">\u003csection class=\"controls\">\u003clabel>Turnus\u003cselect id=\"roster\">\u003c/select>\u003c/label>\u003clabel>Startuke 14. desember\u003cselect id=\"start\">\u003c/select>\u003c/label>\u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"hfree\"> H fri (ellers H jobb)\u003c/label>\u003cbutton id=\"reset\" type=\"button\">Nullstill mine valg\u003c/button>\u003c/section>\u003csection class=\"stats\">\u003cdiv class=\"stat\">\u003cstrong id=\"daysOff\">–\u003c/strong>Fridager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"workDays\">–\u003c/strong>Vaktdager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"attendanceTop\">–\u003c/strong>Antall oppmøter\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"vacDays\">–\u003c/strong>Feriedager registrert\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"redFreeDays\">–\u003c/strong>Kompdager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"hDays\">–\u003c/strong>H-dager\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch2 style=\"margin-top:0;font-size:19px\">🏖️ Min ferie\u003c/h2>\u003cdiv class=\"vacbox\">\u003clabel>Fra dato\u003cinput id=\"from\" type=\"date\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003clabel>Til dato\u003cinput id=\"to\" type=\"date\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003cbutton class=\"primary\" id=\"addvac\">Legg til ferie\u003c/button>\u003cbutton id=\"clearvac\">Slett all ferie\u003c/button>\u003c/div>\u003cdiv id=\"vaclist\" class=\"vaclist\">\u003c/div>\u003cp class=\"help\">Ferie markeres med en gul ramme. Den opprinnelige vakten vises fortsatt. Opplysningene lagres bare i denne nettleseren på denne enheten.\u003c/p>\u003c/section>\u003cnav class=\"extra-nav\" aria-label=\"Flere funksjoner\">\u003cbutton class=\"active\" data-tab=\"overview\">📅 Årsoversikt\u003c/button>\u003cbutton data-tab=\"compare\">⚖️ Sammenlign\u003c/button>\u003cbutton data-tab=\"stats\">📊 Statistikk\u003c/button>\u003cbutton data-tab=\"rank\">🏆 Finn beste turnus\u003c/button>\u003cbutton data-tab=\"dates\">💜 Merkedager\u003c/button>\u003cbutton data-tab=\"tools\">💾 Eksport og utskrift\u003c/button>\u003c/nav>\n\u003csection id=\"extra-compare\" class=\"card extra-panel\">\u003ch2>⚖️ Sammenlign turnuser\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Alternativ A – turnus\u003cselect id=\"cmpRosterA\">\u003c/select>\u003c/label>\u003clabel>Startuke\u003cselect id=\"cmpWeekA\">\u003c/select>\u003c/label>\u003clabel>Alternativ B – turnus\u003cselect id=\"cmpRosterB\">\u003c/select>\u003c/label>\u003clabel>Startuke\u003cselect id=\"cmpWeekB\">\u003c/select>\u003c/label>\u003c/div>\u003cp class=\"hint\">Begge alternativer bruker samme H-innstilling, ferie og merkedager. Tallene gjelder 14.12.2026–12.12.2027.\u003c/p>\u003cdiv id=\"comparisonResult\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-stats\" class=\"card extra-panel\">\u003ch2>📊 Detaljert turnusstatistikk\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Tidligvakt starter før\u003cinput id=\"earlyLimit\" type=\"time\" value=\"07:00\">\u003c/label>\u003clabel>Senvakt er ferdig etter\u003cinput id=\"lateLimit\" type=\"time\" value=\"20:00\">\u003c/label>\u003clabel>Nattvakt fra\u003cinput id=\"nightFrom\" type=\"time\" value=\"01:20\">\u003c/label>\u003clabel>Nattvakt til\u003cinput id=\"nightTo\" type=\"time\" value=\"04:45\">\u003c/label>\u003c/div>\u003cdiv id=\"extraStats\">\u003c/div>\u003cp class=\"hint\">Nattvakt: velg selv tidsrommet som hele vakten må dekke (standard 01:20–04:45). Vakt 527177A telles aldri som nattvakt. Arbeidsdager helg: hver lørdag og søndag med arbeidsvakt telles som én arbeidsdag (to arbeidsdager dersom begge dager har vakt). Dag2 telles ikke som egen vakt. Ferie fjerner planlagte vakter fra statistikken.\u003c/p>\u003c/section>\n\u003csection id=\"extra-rank\" class=\"card extra-panel\">\u003ch2>🏆 Finn min beste turnus\u003c/h2>\u003cp class=\"hint\">Velg hva du prioriterer. Alle 78 kombinasjonene vurderes. Poeng er en veiledende rangering, ikke en offisiell turnusvurdering.\u003c/p>\u003cdiv class=\"row\">\u003clabel>Flest fridager helg\u003cselect id=\"weightWeekend\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Flest kompdager\u003cselect id=\"weightComp\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest nattvakter\u003cselect id=\"weightNight\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest tidligvakter\u003cselect id=\"weightEarly\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest oppmøter\u003cselect id=\"weightAttendance\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest senvakter\u003cselect id=\"weightLate\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv id=\"ranking\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-dates\" class=\"card extra-panel\">\u003ch2>💜 Mine private merkedager\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Dato\u003cinput type=\"date\" id=\"importantDate\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003clabel>Beskrivelse\u003cinput id=\"importantText\" maxlength=\"80\" placeholder=\"F.eks. bursdag\">\u003c/label>\u003cbutton class=\"primary\" id=\"addImportant\">Legg til\u003c/button>\u003c/div>\u003cdiv id=\"importantList\">\u003c/div>\u003cp class=\"hint\">Merkedagene vises med lilla ramme i kalenderen og beholdes når du prøver en annen turnus. Opplysningene lagres bare lokalt.\u003c/p>\u003c/section>\n\u003csection id=\"extra-tools\" class=\"card extra-panel\">\u003ch2>💾 Sikkerhetskopi, PDF og installasjon\u003c/h2>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"exportData\">Eksporter mine data (.json)\u003c/button>\u003clabel>Importer sikkerhetskopi\u003cinput id=\"importData\" type=\"file\" accept=\".json,application/json\">\u003c/label>\u003cbutton id=\"printYear\">🖨️ Skriv ut / lagre som PDF\u003c/button>\u003cbutton id=\"installApp\" hidden>📱 Installer app\u003c/button>\u003c/div>\u003cp class=\"help\">Eksporten inneholder personlige valg, ferie og merkedager. Oppbevar filen privat. Import erstatter eksisterende valg. For installasjon på hjemskjermen må appen publiseres via HTTPS med de tilhørende PWA-filene. Åpning som lokal HTML-fil støtter ikke full PWA-installasjon.\u003c/p>\u003c/section>\n\u003cdiv id=\"printHeading\" class=\"print-only\">\u003c/div>\u003cdiv class=\"toolbar\" id=\"calendarToolbar\">\u003ch2>Årsoversikt\u003c/h2>\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"dot green\">\u003c/i>Fri (O/X/T, ev. H)\u003c/span>\u003cspan>\u003ci class=\"dot work\">\u003c/i>Vakt / Dag2\u003c/span>\u003cspan>\u003ci class=\"dot vac\">\u003c/i>Ferie\u003c/span>\u003c/div>\u003c/div>\u003cdiv id=\"months\" class=\"months\">\u003c/div>\u003csection id=\"detail\" class=\"detail\" aria-live=\"polite\">Trykk på en dato for detaljer om vakten.\u003c/section>\u003cdiv class=\"foot\">Grunnlag: K-Stk 1–3 R27, versjon 16.10.2026. Dag2 vises som egen kode uten grønn fridagsmarkering. Vaktene er hentet fra PDF-grunnlaget; kontroller alltid gjeldende offisiell turnus ved avvik.\u003c/div>\u003c/main>\u003cscript>\nconst DATA=[[[{\"code\":\"O\",\"time\":\"\"},{\"code\":\"442248\",\"time\":\"16:04-21:46\"},{\"code\":\"442248\",\"time\":\"16:04-21:46\"},{\"code\":\"442242\",\"time\":\"08:59-19:55\"},{\"code\":\"442242\",\"time\":\"08:59-19:55\"},{\"code\":\"T\",\"time\":\"\"},{\"code\":\"442242\",\"time\":\"08:59-19:55\"}],[{\"code\":\"442240\",\"time\":\"06:53-15:59\"},{\"code\":\"442242\",\"time\":\"08:59-19:55\"},{\"code\":\"442242\",\"time\":\"08:59-19:55\"},{\"code\":\"44R0710\",\"time\":\"07:10-15:50\"},{\"code\":\"442240\",\"time\":\"06:53-15:59\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"O\",\"time\":\"\"}],[{\"code\":\"O\",\"time\":\"\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"T\",\"time\":\"\"},{\"code\":\"442248\",\"time\":\"16:04-21:46\"},{\"code\":\"44H1330\",\"time\":\"13:30-22:00\"},{\"code\":\"442242L\",\"time\":\"08:59-19:55\"},{\"code\":\"442248\",\"time\":\"16:04-21:46\"}],[{\"code\":\"442242\",\"time\":\"08:59-19:55\"},{\"code\":\"442240\",\"time\":\"06:53-15:59\"},{\"code\":\"442240\",\"time\":\"06:53-15:59\"},{\"code\":\"442240\",\"time\":\"06:53-15:59\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"O\",\"time\":\"\"}],[{\"code\":\"442248\",\"time\":\"16:04-21:46\"},{\"code\":\"T\",\"time\":\"\"},{\"code\":\"44R0710\",\"time\":\"07:10-15:50\"},{\"code\":\"O\",\"time\":\"\"},{\"code\":\"442248\",\"time\":\"16:04-21:46\"},{\"code\":\"44R1010\",\"time\":\"10:10-17:50\"},{\"code\":\"44R1010\",\"time\":\"10:10-17:50\"}],[{\"code\":\"44R0710\",\"time\":\"07:10-15:50\"},{\"code\":\"44R0710\",\"time\":\"07:10-15:50\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"T\",\"time\":\"\"},{\"code\":\"44R0710\",\"time\":\"07:10-15:50\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"O\",\"time\":\"\"}]]];\nconst KEY='andalsnes_r27_private_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}};\nstate.roster=(Number.isInteger(state.roster)&&state.roster>=1&&state.roster\u003c=1)?state.roster:1;state.start=(Number.isInteger(state.start)&&state.start>=1&&state.start\u003c=DATA[state.roster-1].length)?state.start:1;state.hfree=!!state.hfree;state.vacations=Array.isArray(state.vacations)?state.vacations:[];\nconst $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};\nconst startUTC=Date.UTC(2026,11,14),endUTC=Date.UTC(2027,11,12),MS=86400000;\nconst iso=d=>new Date(d).toISOString().slice(0,10);const dayNumber=d=>Math.round((d-startUTC)/MS);const dateLabel=s=>new Date(s+'T12:00:00Z').toLocaleDateString('nb-NO',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});\nconst HOLIDAYS=new Set(['2026-12-25','2026-12-26','2027-01-01','2027-03-25','2027-03-26','2027-03-27','2027-03-29','2027-05-01','2027-05-06','2027-05-17']);\nfunction entry(d){let n=dayNumber(d);if(n\u003c0||d>endUTC)return null;let w=(state.start-1+Math.floor(n/7))%DATA[state.roster-1].length;return {...DATA[state.roster-1][w][n%7],week:w+1}}\nfunction isFree(e){return ['O','X','T'].includes(e.code)||(state.hfree&&e.code.includes('H'))}\nfunction onVacation(d){let s=iso(d);return state.vacations.some(v=>v.from\u003c=s&&s\u003c=v.to)}\nfunction dag2Fri(d){return d>startUTC&&onVacation(d-MS)}\nfunction dag2FriFor(d){return d>startUTC&&onVacation(d-MS)}\n\n// Beregning for aarsoversikt (samme IIFE som render).\nconst attendanceLinksOverview=new Set([]);\nfunction attendanceCountOverview(){\n let count=0,previous=null;\n for(let d=startUTC;d\u003c=endUTC;d+=MS){\n  const e=entry(d), items=Array.isArray(e)?e:[e];\n  for(const item of items){\n   const code=String(item?.code||'').trim();\n   if(!code||['O','X','T','Dag2'].includes(code)||(state.hfree&&code.includes('H'))||onVacation(d)){\n    previous=null;continue;\n   }\n   if(!(previous&&attendanceLinksOverview.has(previous+'|'+code)))count++;\n   previous=code;\n  }\n }\n return count;\n}\nfunction render(){let html='',off=0,work=0,h=0,vac=0,redFree=0;for(let d=startUTC;d\u003c=endUTC;d+=MS){let e=entry(d);let free=isFree(e)||(e.code==='Dag2'&&dag2Fri(d)),holiday=onVacation(d);if(free||holiday)off++;else work++;if(e.code.includes('H'))h++;if(holiday)vac++;if(HOLIDAYS.has(iso(d))&&iso(d)!=='2027-03-28'&&isFree(e))redFree++}\n$('daysOff').textContent=off;$('workDays').textContent=work;$('attendanceTop').textContent=attendanceCountOverview();$('vacDays').textContent=vac;$('hDays').textContent=h;$('redFreeDays').textContent=redFree;\nfor(let monthIndex=0;monthIndex\u003c13;monthIndex++){let year=monthIndex===0?2026:2027,month=monthIndex===0?11:monthIndex-1;let first=Date.UTC(year,month,1),last=Date.UTC(year,month+1,0);let title=new Date(first).toLocaleDateString('nb-NO',{month:'long',year:'numeric',timeZone:'UTC'});html+='\u003carticle class=\"month\">\u003ch3>'+title[0].toUpperCase()+title.slice(1)+'\u003c/h3>\u003cdiv class=\"weekdays\">'+['M','T','O','T','F','L','S'].map(x=>'\u003cspan>'+x+'\u003c/span>').join('')+'\u003c/div>\u003cdiv class=\"days\">';let offset=(new Date(first).getUTCDay()+6)%7;for(let k=0;k\u003coffset;k++)html+='\u003cdiv class=\"cell empty\">\u003c/div>';for(let d=first;d\u003c=last;d+=MS){let e=entry(d);if(!e){html+='\u003cdiv class=\"cell empty\">\u003c/div>';continue}let free=isFree(e)||(e.code==='Dag2'&&dag2Fri(d)),v=onVacation(d),s=iso(d),shownCode=(e.code==='Dag2'&&dag2Fri(d)?'Fri':e.code);html+='\u003cdiv role=\"button\" tabindex=\"0\" class=\"cell '+(free?'off ':'')+(v?'vacation ':'')+(HOLIDAYS.has(s)?'holiday':'')+'\" data-date=\"'+s+'\" title=\"'+s+' · '+shownCode+' '+e.time+'\">\u003cdiv class=\"num\">'+new Date(d).getUTCDate()+'\u003c/div>\u003cdiv class=\"code '+(e.code.includes('R')?'r-duty':'')+'\">'+shownCode+'\u003c/div>\u003cdiv class=\"time\">'+e.time+'\u003c/div>'+(v?'\u003cspan class=\"badge\">Ferie\u003c/span>':'')+'\u003c/div>'}html+='\u003c/div>\u003c/article>'} $('months').innerHTML=html;\n$('vaclist').innerHTML=state.vacations.length?state.vacations.map((v,i)=>'\u003cspan class=\"vacitem\">'+dateLabel(v.from)+' – '+dateLabel(v.to)+' \u003cbutton aria-label=\"Slett ferie\" data-remove=\"'+i+'\">×\u003c/button>\u003c/span>').join(''):'\u003cspan class=\"muted\">Ingen ferie registrert ennå.\u003c/span>';\n}\nfor(let i=1;i\u003c=1;i++)$('roster').add(new Option('Turnus '+i,i));function syncStartWeeks(){let el=$('start'),n=DATA[state.roster-1].length;el.innerHTML='';for(let i=1;i\u003c=n;i++)el.add(new Option('Uke '+i,i));if(state.start>n)state.start=1;el.value=state.start;}syncStartWeeks();$('roster').value=state.roster;$('start').value=state.start;$('hfree').checked=state.hfree;\n$('roster').onchange=e=>{state.roster=+e.target.value;syncStartWeeks();save();render()};$('start').onchange=e=>{state.start=+e.target.value;save();render()};$('hfree').onchange=e=>{state.hfree=e.target.checked;save();render()};\n$('addvac').onclick=()=>{let a=$('from').value,b=$('to').value;if(!a||!b||a>b||a\u003c'2026-12-14'||b>'2027-12-12'){alert('Velg gyldige datoer innenfor turnusåret.');return}state.vacations.push({from:a,to:b});state.vacations.sort((a,b)=>a.from.localeCompare(b.from));save();render()};\n$('clearvac').onclick=()=>{if(confirm('Vil du slette alle dine registrerte ferieperioder?')){state.vacations=[];save();render()}};\n$('reset').onclick=()=>{if(confirm('Nullstille turnusvalg og ferieperioder på denne enheten?')){state={roster:1,start:1,hfree:false,vacations:[]};save();location.reload()}};\n$('vaclist').onclick=e=>{let b=e.target.closest('[data-remove]');if(b){state.vacations.splice(+b.dataset.remove,1);save();render()}};\nfunction showDetail(el){let s=el.dataset.date,d=Date.parse(s+'T00:00:00Z'),e=entry(d),isDag2Fri=e.code==='Dag2'&&dag2Fri(d),shownCode=isDag2Fri?'Fri':e.code;$('detail').textContent=dateLabel(s)+' · Turnus '+state.roster+', uke '+e.week+' · '+shownCode+(e.time?' · '+e.time:'')+' · '+(isFree(e)||isDag2Fri?'Fridag':e.code==='Dag2'?'Dag 2 – arbeidsdag':'Vanlig markering')+(onVacation(d)?' · Ferie registrert':'')}\n$('months').addEventListener('click',e=>{let el=e.target.closest('[data-date]');if(el)showDetail(el)});$('months').addEventListener('keydown',e=>{if(e.key==='Enter'){let el=e.target.closest('[data-date]');if(el)showDetail(el)}});render();\n\u003c/script>\u003cscript>\n(function(){\n'use strict';\nstate.important=Array.isArray(state.important)?state.important:[];\nconst get=id=>document.getElementById(id), dayMs=86400000;\nconst safe=t=>String(t).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst dateUTC=s=>Date.parse(s+'T00:00:00Z');\nconst allDates=[];for(let d=startUTC;d\u003c=endUTC;d+=dayMs)allDates.push(d);\nfunction datum(roster,week,d){let n=dayNumber(d);return DATA[roster-1][(week-1+Math.floor(n/7))%DATA[roster-1].length][n%7]}\nfunction free(e){return ['O','X','T'].includes(e.code)||(state.hfree&&e.code.includes('H'))}\nfunction vacation(d){return onVacation(d)}\nfunction duty(e,d){return !free(e)&&!(e.code==='Dag2'&&dag2FriFor(d))&&!vacation(d)}\nfunction hm(time){return time?Number(time.slice(0,2))*60+Number(time.slice(3,5)):null}\nfunction limits(){return {early:hm(get('earlyLimit').value)??420,late:hm(get('lateLimit').value)??840,nightFrom:hm(get('nightFrom').value)??80,nightTo:hm(get('nightTo').value)??285}}\nfunction coversNight(a,b,from,to){if(a===null||b===null||from===to)return false;let end=b\u003c=a?b+1440:b;for(let k=-1;k\u003c=1;k++){let start=from+k*1440,finish=to+k*1440+(to\u003c=from?1440:0);if(a\u003c=start&&end>=finish)return true}return false}\nconst nightSettingsKey='turnusvelger-r27-andalsnes-night-range';try{let z=JSON.parse(localStorage.getItem(nightSettingsKey)||'null');if(z&&/^([01]\\d|2[0-3]):[0-5]\\d$/.test(z.from)&&/^([01]\\d|2[0-3]):[0-5]\\d$/.test(z.to)){get('nightFrom').value=z.from;get('nightTo').value=z.to}}catch(e){}\nconst attendanceLinks=new Set([]);\nfunction attendanceCount(roster,week){\n let count=0,previous=null;\n for(const d of allDates){\n  const e=datum(roster,week,d),items=Array.isArray(e)?e:[e];\n  for(const item of items){\n   const code=String(item?.code||'').trim();\n   if(!code||code==='Dag2'||!duty(item,d)){previous=null;continue}\n   if(!(previous&&attendanceLinks.has(previous+'|'+code)))count++;\n   previous=code;\n  }\n }\n return count;\n}\nfunction analyze(roster,week){let r={off:0,work:0,comp:0,h:0,early:0,late:0,night:0,rDuty:0,weekendWork:0,weekendFree:0,weekendFreeDays:0,markedFree:0,markedTotal:state.important.length,attendance:attendanceCount(roster,week)};let {early,late,nightFrom,nightTo}=limits();let weekends={};for(let d of allDates){let e=datum(roster,week,d),f=free(e),v=vacation(d),s=iso(d);if(f||v||(e.code==='Dag2'&&dag2FriFor(d)))r.off++;else r.work++;if(e.code.includes('H'))r.h++;if(HOLIDAYS.has(s)&&f)r.comp++;if(state.important.some(m=>m.date===s)&&(f||v))r.markedFree++;\nlet wd=new Date(d).getUTCDay();if(wd===6||wd===0){let monday=d-((wd+6)%7)*dayMs;let key=iso(monday);if(!weekends[key])weekends[key]=0;if(duty(e,d))weekends[key]++;else r.weekendFreeDays++}\nif(duty(e,d)){let times=e.time.split('-');if(times.length===2){let a=hm(times[0]),b=hm(times[1]);if(a\u003cearly)r.early++;if(b>late)r.late++;if(e.code!=='527177A' && coversNight(a,b,nightFrom,nightTo))r.night++}if(e.code.includes('R'))r.rDuty++}}\nfor(let count of Object.values(weekends)){if(count)r.weekendWork+=count;else r.weekendFree++}return r}\nfunction metric(label,n){return '\u003cspan class=\"mini-stat\">\u003cb>'+safe(label)+':\u003c/b> '+n+'\u003c/span>'}\nfunction fillSelect(id,n,label){let el=get(id);for(let i=1;i\u003c=n;i++)el.add(new Option(label+i,i))}\nfillSelect('cmpRosterA',1,'Turnus ');fillSelect('cmpRosterB',1,'Turnus ');fillSelect('cmpWeekA',8,'Uke ');fillSelect('cmpWeekB',8,'Uke ');\nget('cmpRosterA').value=state.roster;get('cmpWeekA').value=state.start;get('cmpRosterB').value=1;get('cmpWeekB').value=state.start; if(+get('cmpWeekB').value>DATA[+get('cmpRosterB').value-1].length)get('cmpWeekB').value='1';\nfunction isoWeek(d){let x=new Date(d);x.setUTCHours(0,0,0,0);x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));let year=x.getUTCFullYear();let first=Date.UTC(year,0,1);return {year,week:Math.ceil((((x-first)/dayMs)+1)/7)}}\nfunction weekOverview(roster,week){let h='';for(let d=startUTC;d\u003c=endUTC;d+=7*dayMs){let wn=isoWeek(d),n=dayNumber(d),rw=(week-1+Math.floor(n/7))%DATA[roster-1].length+1;h+='\u003cdiv style=\"margin:9px 0 4px;font-size:12px\">\u003cb>Kalenderuke '+wn.week+'/'+wn.year+'\u003c/b> · turnusuke '+rw+'\u003c/div>\u003cdiv class=\"week-grid\">';for(let k=0;k\u003c7;k++){let dt=d+k*dayMs,e=datum(roster,week,dt),s=iso(dt),mark=state.important.some(m=>m.date===s);h+='\u003cdiv class=\"wkday '+(free(e)?'off ':'')+(vacation(dt)?'vacation ':'')+(HOLIDAYS.has(s)?'holiday ':'')+(e.code.includes('R')?'r-duty':'')+'\" title=\"'+safe(s+' '+e.code+' '+e.time)+'\" '+(mark?'style=\"outline:2px solid #8a50be\"':'')+'>'+new Date(dt).getUTCDate()+'.'+(new Date(dt).getUTCMonth()+1)+'\u003cbr>\u003cb>'+safe(e.code)+'\u003c/b>\u003c/div>'}h+='\u003c/div>'}return h}\nfunction comparison(){for(let side of ['A','B']){let r=+get('cmpRoster'+side).value,w=get('cmpWeek'+side),limit=DATA[r-1].length;for(let o of w.options)o.disabled=+o.value>limit;if(+w.value>limit)w.value='1'}let a=+get('cmpRosterA').value,aw=+get('cmpWeekA').value,b=+get('cmpRosterB').value,bw=+get('cmpWeekB').value,x=analyze(a,aw),y=analyze(b,bw);let names=[['Vaktdager','work'],['Fridager','off'],['Kompdager','comp'],['H-dager','h'],['Arbeidsdager helg','weekendWork'],['Frihelger','weekendFree'],['Tidligvakter','early'],['Senvakter','late'],['Nattvakter','night'],['R-vakter','rDuty'],['Private merkedager fri','markedFree']];get('comparisonResult').innerHTML='\u003ctable class=\"comparison-table\">\u003cthead>\u003ctr>\u003cth>Statistikk\ 03c/style>\u003c/head>\u003cbody>\u003cheader>\u003ch1>🚆 Turnusvelger R27 · Oslo\u003c/h1>\u003cp>1 turnus · 6/3 startuker · 14.12.2026–12.12.2027\u003c/p>\u003c/header>\u003cmain class=\"wrap\">\u003csection class=\"controls\">\u003clabel>Turnus\u003cselect id=\"roster\">\u003c/select>\u003c/label>\u003clabel>Startuke 14. desember\u003cselect id=\"start\">\u003c/select>\u003c/label>\u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"hfree\"> H fri (ellers H jobb)\u003c/label>\u003cbutton id=\"reset\" type=\"button\">Nullstill mine valg\u003c/button>\u003c/section>\u003csection class=\"stats\">\u003cdiv class=\"stat\">\u003cstrong id=\"daysOff\">–\u003c/strong>Fridager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"workDays\">–\u003c/strong>Vaktdager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"attendanceTop\">–\u003c/strong>Antall oppmøter\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"vacDays\">–\u003c/strong>Feriedager registrert\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"redFreeDays\">–\u003c/strong>Kompdager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"hDays\">–\u003c/strong>H-dager\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch2 style=\"margin-top:0;font-size:19px\">🏖️ Min ferie\u003c/h2>\u003cdiv class=\"vacbox\">\u003clabel>Fra dato\u003cinput id=\"from\" type=\"date\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003clabel>Til dato\u003cinput id=\"to\" type=\"date\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003cbutton class=\"primary\" id=\"addvac\">Legg til ferie\u003c/button>\u003cbutton id=\"clearvac\">Slett all ferie\u003c/button>\u003c/div>\u003cdiv id=\"vaclist\" class=\"vaclist\">\u003c/div>\u003cp class=\"help\">Ferie markeres med en gul ramme. Den opprinnelige vakten vises fortsatt. Opplysningene lagres bare i denne nettleseren på denne enheten.\u003c/p>\u003c/section>\u003cnav class=\"extra-nav\" aria-label=\"Flere funksjoner\">\u003cbutton class=\"active\" data-tab=\"overview\">📅 Årsoversikt\u003c/button>\u003cbutton data-tab=\"compare\">⚖️ Sammenlign\u003c/button>\u003cbutton data-tab=\"stats\">📊 Statistikk\u003c/button>\u003cbutton data-tab=\"rank\">🏆 Finn beste turnus\u003c/button>\u003cbutton data-tab=\"dates\">💜 Merkedager\u003c/button>\u003cbutton data-tab=\"tools\">💾 Eksport og utskrift\u003c/button>\u003c/nav>\n\u003csection id=\"extra-compare\" class=\"card extra-panel\">\u003ch2>⚖️ Sammenlign turnuser\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Alternativ A – turnus\u003cselect id=\"cmpRosterA\">\u003c/select>\u003c/label>\u003clabel>Startuke\u003cselect id=\"cmpWeekA\">\u003c/select>\u003c/label>\u003clabel>Alternativ B – turnus\u003cselect id=\"cmpRosterB\">\u003c/select>\u003c/label>\u003clabel>Startuke\u003cselect id=\"cmpWeekB\">\u003c/select>\u003c/label>\u003c/div>\u003cp class=\"hint\">Begge alternativer bruker samme H-innstilling, ferie og merkedager. Tallene gjelder 14.12.2026–12.12.2027.\u003c/p>\u003cdiv id=\"comparisonResult\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-stats\" class=\"card extra-panel\">\u003ch2>📊 Detaljert turnusstatistikk\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Tidligvakt starter før\u003cinput id=\"earlyLimit\" type=\"time\" value=\"07:00\">\u003c/label>\u003clabel>Senvakt er ferdig etter\u003cinput id=\"lateLimit\" type=\"time\" value=\"20:00\">\u003c/label>\u003clabel>Nattvakt fra\u003cinput id=\"nightFrom\" type=\"time\" value=\"01:20\">\u003c/label>\u003clabel>Nattvakt til\u003cinput id=\"nightTo\" type=\"time\" value=\"04:45\">\u003c/label>\u003c/div>\u003cdiv id=\"extraStats\">\u003c/div>\u003cp class=\"hint\">Nattvakt: velg selv tidsrommet som hele vakten må dekke (standard 01:20–04:45). Vakt 527177A telles aldri som nattvakt. Arbeidsdager helg: hver lørdag og søndag med arbeidsvakt telles som én arbeidsdag (to arbeidsdager dersom begge dager har vakt). Dag2 telles ikke som egen vakt. Ferie fjerner planlagte vakter fra statistikken.\u003c/p>\u003c/section>\n\u003csection id=\"extra-rank\" class=\"card extra-panel\">\u003ch2>🏆 Finn min beste turnus\u003c/h2>\u003cp class=\"hint\">Velg hva du prioriterer. Alle 78 kombinasjonene vurderes. Poeng er en veiledende rangering, ikke en offisiell turnusvurdering.\u003c/p>\u003cdiv class=\"row\">\u003clabel>Flest fridager helg\u003cselect id=\"weightWeekend\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Flest kompdager\u003cselect id=\"weightComp\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest nattvakter\u003cselect id=\"weightNight\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest tidligvakter\u003cselect id=\"weightEarly\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest oppmøter\u003cselect id=\"weightAttendance\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest senvakter\u003cselect id=\"weightLate\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv id=\"ranking\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-dates\" class=\"card extra-panel\">\u003ch2>💜 Mine private merkedager\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Dato\u003cinput type=\"date\" id=\"importantDate\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003clabel>Beskrivelse\u003cinput id=\"importantText\" maxlength=\"80\" placeholder=\"F.eks. bursdag\">\u003c/label>\u003cbutton class=\"primary\" id=\"addImportant\">Legg til\u003c/button>\u003c/div>\u003cdiv id=\"importantList\">\u003c/div>\u003cp class=\"hint\">Merkedagene vises med lilla ramme i kalenderen og beholdes når du prøver en annen turnus. Opplysningene lagres bare lokalt.\u003c/p>\u003c/section>\n\u003csection id=\"extra-tools\" class=\"card extra-panel\">\u003ch2>💾 Sikkerhetskopi, PDF og installasjon\u003c/h2>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"exportData\">Eksporter mine data (.json)\u003c/button>\u003clabel>Importer sikkerhetskopi\u003cinput id=\"importData\" type=\"file\" accept=\".json,application/json\">\u003c/label>\u003cbutton id=\"printYear\">🖨️ Skriv ut / lagre som PDF\u003c/button>\u003cbutton id=\"installApp\" hidden>📱 Installer app\u003c/button>\u003c/div>\u003cp class=\"help\">Eksporten inneholder personlige valg, ferie og merkedager. Oppbevar filen privat. Import erstatter eksisterende valg. For installasjon på hjemskjermen må appen publiseres via HTTPS med de tilhørende PWA-filene. Åpning som lokal HTML-fil støtter ikke full PWA-installasjon.\u003c/p>\u003c/section>\n\u003cdiv id=\"printHeading\" class=\"print-only\">\u003c/div>\u003cdiv class=\"toolbar\" id=\"calendarToolbar\">\u003ch2>Årsoversikt\u003c/h2>\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"dot green\">\u003c/i>Fri (O/X/T, ev. H)\u003c/span>\u003cspan>\u003ci class=\"dot work\">\u003c/i>Vakt / Dag2\u003c/span>\u003cspan>\u003ci class=\"dot vac\">\u003c/i>Ferie\u003c/span>\u003c/div>\u003c/div>\u003cdiv id=\"months\" class=\"months\">\u003c/div>\u003csection id=\"detail\" class=\"detail\" aria-live=\"polite\">Trykk på en dato for detaljer om vakten.\u003c/section>\u003cdiv class=\"foot\">Grunnlag: K-Osl 1–4 R27, versjon 16.10.2026. Dag2 vises som egen kode uten grønn fridagsmarkering. Vaktene er hentet fra PDF-grunnlag let begin=day+a*60000,finish=day+(b\u003c=a?b+1440:b)*60000;\nlet m=ds.slice(0,7);if(!months[m])months[m]=[0,0];\nfor(let dt=day-DAY;dt\u003c=finish+DAY;dt+=DAY){let n=overlap(begin,finish,dt+20*3600000,dt+30*3600000);totals[0]+=n;months[m][0]+=n;\nlet wd=new Date(dt).getUTCDay();if(wd===5){let w=overlap(begin,finish,dt+20*3600000,dt+3*DAY+5*3600000);totals[1]+=w;months[m][1]+=w;}}\n}\nlet box=document.getElementById('mosjoen-premiums');if(!box)return;\nlet fmt=n=>(n/3600000).toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2});\nbox.innerHTML='\u003ch3>🌙 Natt- og helgetillegg\u003c/h3>\u003cp>Nattillegg: \u003cb>'+fmt(totals[0])+' timer\u003c/b> · Helgetillegg: \u003cb>'+fmt(totals[1])+' timer\u003c/b>\u003c/p>\u003cp class=\"hint\">Nattillegg 20:00–06:00. Helgetillegg fredag 20:00–mandag 05:00. Overlapp teller i begge kategorier. Beregnet fra vaktenes klokkeslett.\u003c/p>\u003ctable class=\"comparison-table\">\u003cthead>\u003ctr>\u003cth>Måned (vaktstart)\u003c/th>\u003cth>Natt\u003c/th>\u003cth>Helg\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+Object.entries(months).sort().map(([m,v])=>'\u003ctr>\u003ctd>'+m+'\u003c/td>\u003ctd>'+fmt(v[0])+'\u003c/td>\u003ctd>'+fmt(v[1])+'\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>';\n}\nlet stats=document.getElementById('extra-stats');if(stats){let el=document.createElement('div');el.id='mosjoen-premiums';el.style.marginTop='18px';stats.appendChild(el)}\n// Stats panel may be named differently in older versions.\nif(!document.getElementById('mosjoen-premiums')){let el=document.createElement('div');el.id='mosjoen-premiums';(document.getElementById('extraStats')||document.getElementById('extra-stats')||document.body).after(el)}\ndocument.getElementById('start').addEventListener('change',()=>setTimeout(count,0));\ndocument.getElementById('roster').addEventListener('change',()=>setTimeout(count,0));\ndocument.addEventListener('click',()=>setTimeout(count,0));count();\n})();\n\u003c/script>\n\u003cstyle id=\"iso-week-column-style\">\n/* Ukenummer gjelder bare minikalenderen i årsoversikten. */\n#months .month .weekdays, #months .month .days {grid-template-columns: minmax(24px,0.65fr) repeat(7,minmax(0,1fr));}\n#months .month .weekdays .week-number-head {font-weight:700;color:#52677e;}\n#months .month .days .iso-week-number {display:flex;align-items:flex-start;justify-content:center;padding:6px 1px;min-width:0;background:#e8f0f8;border-radius:5px;color:#36516d;font-size:11px;font-weight:750;cursor:default;}\n@media(max-width:640px){#months .month .weekdays,#months .month .days{grid-template-columns:minmax(26px,.65fr) repeat(7,minmax(0,1fr));}}\n\u003c/style>\n\u003cscript>\n(function(){\n  'use strict';\n  const root=document.getElementById('months');\n  if(!root)return;\n  function isoWeek(date){\n    const d=new Date(date.getTime());\n    d.setUTCHours(0,0,0,0);\n    d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));\n    const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));\n    return Math.ceil((((d-y)/86400000)+1)/7);\n  }\n  function addWeekNumbers(){\n    const months=root.querySelectorAll('.month');\n    months.forEach((month,index)=>{\n      const header=month.querySelector('.weekdays');\n      const days=month.querySelector('.days');\n      if(!header||!days||header.querySelector('.week-number-head'))return;\n      const head=document.createElement('span');head.className='week-number-head';head.textContent='Uke';\n      header.insertBefore(head,header.firstChild);\n      const cells=Array.from(days.children);\n      const year=index===0?2026:2027, monthNo=index===0?11:index-1;\n      const first=new Date(Date.UTC(year,monthNo,1));\n      const offset=(first.getUTCDay()+6)%7;\n      const firstMonday=Date.UTC(year,monthNo,1-offset);\n      for(let row=0;row\u003cMath.ceil(cells.length/7);row++){\n        const week=document.createElement('div');\n        week.className='iso-week-number';\n        week.textContent=String(isoWeek(new Date(firstMonday+row*7*86400000)));\n        week.setAttribute('aria-label','Uke '+week.textContent);\n        days.insertBefore(week,cells[row*7]||null);\n      }\n    });\n  }\n  let scheduled=false;\n  const observer=new MutationObserver(()=>{\n    if(scheduled)return;\n    scheduled=true;\n    queueMicrotask(()=>{scheduled=false;observer.disconnect();try{addWeekNumbers()}finally{observer.observe(root,{childList:true})}});\n  });\n  addWeekNumbers();\n  observer.observe(root,{childList:true});\n})();\n\u003c/script>\n\u003c/body>\u003c/html>"};
