{break-inside:avoid;padding:6px}.cell{min-height:48px}.cell .time{font-size:8px}.print-only{display:block}.month h3{font-size:13px}body{background:white} @page{size:A4 landscape;margin:9mm}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003ch1>🚆 Turnusvelger R27 · Trondheim\u003c/h1>\u003cp>13 turnuser · 6 startuker · 14.12.2026–12.12.2027\u003c/p>\u003c/header>\u003cmain class=\"wrap\">\u003csection class=\"controls\">\u003clabel>Turnus\u003cselect id=\"roster\">\u003c/select>\u003c/label>\u003clabel>Startuke 14. desember\u003cselect id=\"start\">\u003c/select>\u003c/label>\u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"hfree\"> H fri (ellers H jobb)\u003c/label>\u003cbutton id=\"reset\" type=\"button\">Nullstill mine valg\u003c/button>\u003c/section>\u003csection class=\"stats\">\u003cdiv class=\"stat\">\u003cstrong id=\"daysOff\">–\u003c/strong>Fridager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"workDays\">–\u003c/strong>Vaktdager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"attendanceTop\">–\u003c/strong>Antall oppmøter\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"vacDays\">–\u003c/strong>Feriedager registrert\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"redFreeDays\">–\u003c/strong>Kompdager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"hDays\">–\u003c/strong>H-dager\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch2 style=\"margin-top:0;font-size:19px\">🏖️ Min ferie\u003c/h2>\u003cdiv class=\"vacbox\">\u003clabel>Fra dato\u003cinput id=\"from\" type=\"date\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003clabel>Til dato\u003cinput id=\"to\" type=\"date\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003cbutton class=\"primary\" id=\"addvac\">Legg til ferie\u003c/button>\u003cbutton id=\"clearvac\">Slett all ferie\u003c/button>\u003c/div>\u003cdiv id=\"vaclist\" class=\"vaclist\">\u003c/div>\u003cp class=\"help\">Ferie markeres med en gul ramme. Den opprinnelige vakten vises fortsatt. Opplysningene lagres bare i denne nettleseren på denne enheten.\u003c/p>\u003c/section>\u003cnav class=\"extra-nav\" aria-label=\"Flere funksjoner\">\u003cbutton class=\"active\" data-tab=\"overview\">📅 Årsoversikt\u003c/button>\u003cbutton data-tab=\"compare\">⚖️ Sammenlign\u003c/button>\u003cbutton data-tab=\"stats\">📊 Statistikk\u003c/button>\u003cbutton data-tab=\"rank\">🏆 Finn beste turnus\u003c/button>\u003cbutton data-tab=\"dates\">💜 Merkedager\u003c/button>\u003cbutton data-tab=\"tools\">💾 Eksport og utskrift\u003c/button>\u003c/nav>\n\u003csection id=\"extra-compare\" class=\"card extra-panel\">\u003ch2>⚖️ Sammenlign turnuser\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Alternativ A – turnus\u003cselect id=\"cmpRosterA\">\u003c/select>\u003c/label>\u003clabel>Startuke\u003cselect id=\"cmpWeekA\">\u003c/select>\u003c/label>\u003clabel>Alternativ B – turnus\u003cselect id=\"cmpRosterB\">\u003c/select>\u003c/label>\u003clabel>Startuke\u003cselect id=\"cmpWeekB\">\u003c/select>\u003c/label>\u003c/div>\u003cp class=\"hint\">Begge alternativer bruker samme H-innstilling, ferie og merkedager. Tallene gjelder 14.12.2026–12.12.2027.\u003c/p>\u003cdiv id=\"comparisonResult\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-stats\" class=\"card extra-panel\">\u003ch2>📊 Detaljert turnusstatistikk\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Tidligvakt starter før\u003cinput id=\"earlyLimit\" type=\"time\" value=\"07:00\">\u003c/label>\u003clabel>Senvakt er ferdig etter\u003cinput id=\"lateLimit\" type=\"time\" value=\"20:00\">\u003c/label>\u003clabel>Nattvakt fra\u003cinput id=\"nightFrom\" type=\"time\" value=\"01:20\">\u003c/label>\u003clabel>Nattvakt til\u003cinput id=\"nightTo\" type=\"time\" value=\"04:45\">\u003c/label>\u003c/div>\u003cdiv id=\"extraStats\">\u003c/div>\u003cp class=\"hint\">Nattvakt: velg selv tidsrommet som hele vakten må dekke (standard 01:20–04:45). Vakt 527177A telles aldri som nattvakt. Arbeidsdager helg: hver lørdag og søndag med arbeidsvakt telles som én arbeidsdag (to arbeidsdager dersom begge dager har vakt). Dag2 telles ikke som egen vakt. Ferie fjerner planlagte vakter fra statistikken. Oppmøter beregnes med bekreftede koblinger mellom dagsverk; øvrige koblinger må kontrolleres mot strekklisten.\u003c/p>\u003c/section>\n\u003csection id=\"extra-rank\" class=\"card extra-panel\">\u003ch2>🏆 Finn min beste turnus\u003c/h2>\u003cp class=\"hint\">Velg hva du prioriterer. Alle valgte turnuser og startuker vurderes. Poeng er en veiledende rangering, ikke en offisiell turnusvurdering.\u003c/p>\u003cdiv class=\"row\">\u003clabel>Flest fridager helg\u003cselect id=\"weightWeekend\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Flest kompdager\u003cselect id=\"weightComp\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest nattvakter\u003cselect id=\"weightNight\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest tidligvakter\u003cselect id=\"weightEarly\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest oppmøter\u003cselect id=\"weightAttendance\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest senvakter\u003cselect id=\"weightLate\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"badge-note\">\u003cstrong>Hvilke turnuser kan du søke?\u003c/strong>\u003cp class=\"hint\">Fjern avhukingen for turnuser du ikke har kompetanse til. Bare avhukede turnuser blir rangert.\u003c/p>\u003cdiv class=\"row\">\u003cbutton type=\"button\" id=\"rankAll\">Velg alle\u003c/button>\u003cbutton type=\"button\" id=\"rankNone\">Fjern alle\u003c/button>\u003c/div>\u003cdiv id=\"rankAllowed\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin:12px 0\">\u003c/div>\u003c/div>\u003cdiv id=\"ranking\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-dates\" class=\"card extra-panel\">\u003ch2>💜 Mine private merkedager\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Dato\u003cinput type=\"date\" id=\"importantDate\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003clabel>Beskrivelse\u003cinput id=\"importantText\" maxlength=\"80\" placeholder=\"F.eks. bursdag\">\u003c/label>\u003cbutton class=\"primary\" id=\"addImportant\">Legg til\u003c/button>\u003c/div>\u003cdiv id=\"importantList\">\u003c/div>\u003cp class=\"hint\">Merkedagene vises med lilla ramme i kalenderen og beholdes når du prøver en annen turnus. Opplysningene lagres bare lokalt.\u003c/p>\u003c/section>\n\u003csection id=\"extra-tools\" class=\"card extra-panel\">\u003ch2>💾 Sikkerhetskopi, PDF og installasjon\u003c/h2>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"exportData\">Eksporter mine data (.json)\u003c/button>\u003clabel>Importer sikkerhetskopi\u003cinput id=\"importData\" type=\"file\" accept=\".json,application/json\">\u003c/label>\u003cbutton id=\"printYear\">🖨️ Skriv ut / lagre som PDF\u003c/button>\u003cbutton id=\"installApp\" hidden>📱 Installer app\u003c/button>\u003c/div>\u003cp class=\"help\">Eksporten inneholder personlige valg, ferie og merkedager. Oppbevar filen privat. Import erstatter eksisterende valg. For installasjon på hjemskjermen må appen publiseres vi ++;else r.weekendFreeDays++}\nif(duty(e,d)){let times=e.time.split('-');if(times.length===2){let a=hm(times[0]),b=hm(times[1]);if(a\u003cearly)r.early++;if(b>late)r.late++;if(e.code!=='527177A' && coversNight(a,b,nightFrom,nightTo))r.night++}if(e.code.includes('R'))r.rDuty++}}\nfor(let count of Object.values(weekends)){if(count)r.weekendWork+=count;else r.weekendFree++}return r}\nfunction metric(label,n){return '\u003cspan class=\"mini-stat\">\u003cb>'+safe(label)+':\u003c/b> '+n+'\u003c/span>'}\nfunction fillSelect(id,n,label){let el=get(id);for(let i=1;i\u003c=n;i++)el.add(new Option(label+i,i))}\nfillSelect('cmpRosterA',13,'Turnus ');fillSelect('cmpRosterB',13,'Turnus ');fillSelect('cmpWeekA',6,'Uke ');fillSelect('cmpWeekB',6,'Uke ');\nget('cmpRosterA').value=state.roster;get('cmpWeekA').value=state.start;get('cmpRosterB').value=state.roster===13?1:state.roster+1;get('cmpWeekB').value=state.start;\nfunction isoWeek(d){let x=new Date(d);x.setUTCHours(0,0,0,0);x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));let year=x.getUTCFullYear();let first=Date.UTC(year,0,1);return {year,week:Math.ceil((((x-first)/dayMs)+1)/7)}}\nfunction weekOverview(roster,week){let h='';for(let d=startUTC;d\u003c=endUTC;d+=7*dayMs){let wn=isoWeek(d),n=dayNumber(d),rw=(week-1+Math.floor(n/7))%6+1;h+='\u003cdiv style=\"margin:9px 0 4px;font-size:12px\">\u003cb>Kalenderuke '+wn.week+'/'+wn.year+'\u003c/b> · turnusuke '+rw+'\u003c/div>\u003cdiv class=\"week-grid\">';for(let k=0;k\u003c7;k++){let dt=d+k*dayMs,e=datum(roster,week,dt),s=iso(dt),mark=state.important.some(m=>m.date===s);h+='\u003cdiv class=\"wkday '+(free(e)?'off ':'')+(vacation(dt)?'vacation ':'')+(HOLIDAYS.has(s)?'holiday ':'')+(e.code.includes('R')?'r-duty':'')+'\" title=\"'+safe(s+' '+e.code+' '+e.time)+'\" '+(mark?'style=\"outline:2px solid #8a50be\"':'')+'>'+new Date(dt).getUTCDate()+'.'+(new Date(dt).getUTCMonth()+1)+'\u003cbr>\u003cb>'+safe(e.code)+'\u003c/b>\u003c/div>'}h+='\u003c/div>'}return h}\nfunction comparison(){let a=+get('cmpRosterA').value,aw=+get('cmpWeekA').value,b=+get('cmpRosterB').value,bw=+get('cmpWeekB').value,x=analyze(a,aw),y=analyze(b,bw);let names=[['Vaktdager','work'],['Antall oppmøter','attendance'],['Fridager','off'],['Kompdager','comp'],['H-dager','h'],['Arbeidsdager helg','weekendWork'],['Frihelger','weekendFree'],['Tidligvakter','early'],['Senvakter','late'],['Nattvakter','night'],['R-vakter','rDuty'],['Private merkedager fri','markedFree']];get('comparisonResult').innerHTML='\u003ctable class=\"comparison-table\">\u003cthead>\u003ctr>\u003cth>Statistikk\u003c/th>\u003cth>Turnus '+a+' / uke '+aw+'\u003c/th>\u003cth>Turnus '+b+' / uke '+bw+'\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+names.map(([label,key])=>'\u003ctr>\u003ctd>'+label+'\u003c/td>\u003ctd>'+x[key]+'\u003c/td>\u003ctd>'+y[key]+'\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003ch3>Uke-for-uke-kalender\u003c/h3>\u003cdiv class=\"comparison\">\u003cdiv class=\"compare-col\">\u003cb>Turnus '+a+' – uke '+aw+'\u003c/b>'+weekOverview(a,aw)+'\u003c/div>\u003cdiv class=\"compare-col\">\u003cb>Turnus '+b+' – uke '+bw+'\u003c/b>'+weekOverview(b,bw)+'\u003c/div>\u003c/div>'}\n\n// Tillegg beregnes fra hele vakten; natt og helg kan overlappe.\nfunction supplementHours(roster,week){\n let night=0,weekend=0,monthly={};\n const yearStart=Date.UTC(2026,11,14),yearEnd=Date.UTC(2027,11,13);\n for(const d of allDates){\n  const e=datum(roster,week,d);\n  if(!duty(e,d)||!e.time)continue;\n  const parts=e.time.split('-');if(parts.length!==2)continue;\n  let a=hm(parts[0]),b=hm(parts[1]);if(a===null||b===null||!Number.isFinite(a)||!Number.isFinite(b))continue;\n  let start=d+a*60000,end=d+b*60000;if(end\u003c=start)end+=86400000;\n  // Segmenter ved midnatt og ved tariffgrensene 05, 06 og 20.\n  for(let t=start;t\u003cend;){\n   let day=Math.floor(t/86400000)*86400000;\n   let candidates=[day+5*3600000,day+6*3600000,day+20*3600000,day+86400000,end];\n   let next=Math.min(...candidates.filter(x=>x>t));\n   let mid=t+(next-t)/2,localDay=Math.floor(mid/86400000)*86400000;\n   let wd=new Date(localDay).getUTCDay(),minutes=(mid-localDay)/60000;\n   let isNight=minutes>=1200||minutes\u003c360;\n   let isWeekend=(wd===5&&minutes>=1200)||wd===6||wd===0||(wd===1&&minutes\u003c300);\n   let from=Math.max(t,yearStart),to=Math.min(next,yearEnd),hours=Math.max(0,to-from)/3600000;\n   if(hours){let month=new Date(from).toISOString().slice(0,7);let m=monthly[month]??(monthly[month]={night:0,weekend:0});if(isNight){night+=hours;m.night+=hours}if(isWeekend){weekend+=hours;m.weekend+=hours}}\n   t=next;\n  }\n }\n return {night,weekend,monthly};\n}\nfunction supplementStats(){\n const v=supplementHours(state.roster,state.start),fmt=n=>n.toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2});\n const rows=Object.entries(v.monthly).sort(([a],[b])=>a.localeCompare(b)).map(([month,x])=>'\u003ctr>\u003ctd>'+month+'\u003c/td>\u003ctd>'+fmt(x.night)+'\u003c/td>\u003ctd>'+fmt(x.weekend)+'\u003c/td>\u003c/tr>').join('');\n return '\u003cdiv style=\"margin-top:20px\">\u003ch3>🌙 Natt- og helgetillegg\u003c/h3>\u003cp>Nattillegg: 20:00–06:00 hver dag. Helgetillegg: fredag 20:00–mandag 05:00. Overlappende timer telles i begge kategorier. Beregnet fra hele oppsatte vakter, ekskludert registrert ferie/fridager.\u003c/p>\u003cdiv class=\"row\">'+metric('Nattillegg, timer',fmt(v.night))+metric('Helgetillegg, timer',fmt(v.weekend))+'\u003c/div>\u003ch4>Fordelt per måned\u003c/h4>\u003ctable style=\"width:100%;text-align:left\">\u003cthead>\u003ctr>\u003cth>Måned\u003c/th>\u003cth>Nattimer\u003c/th>\u003cth>Helgetimer\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+rows+'\u003c/tbody>\u003c/table>\u003c/div>';\n}\n\n// Foreløpig beregning: bare eksplisitt koblede Fra/Til-vakter på påfølgende dager.\n// Dette er oppholdstimer, IKKE et verifisert lønnstillegg i kroner.\nfunction layoverSummary(roster,week){\n let minutes=0,stays=0,rows=[],prev=null;\n const links=(typeof attendanceLinks!=='undefined'?attendanceLinks:linkedDuties);\n for(const d of allDates){\n  const e=datum(roster,week,d),items=Array.isArray(e)?e:[e];\n  for(const item of items){\n   const code=String(item?.code||'').trim();\n   // Bekreftet A-DelDU: 382591 på søndag, opphold 21:50–04:05 neste dag.\n   // A-DelDH skal aldri inkluderes. Øvrige A-DelDU må registreres fra strekklisten.\n   if(code.toUpperCase()==='382591'&&new Date(d).getUTCDay()===0&&duty(item,d)){\n    const splitMinutes=6*60+15;\n    minutes+=splitMinutes;stays++;\n    rows.push({date:iso(d),out:code,back:'A-DelDU 21:50–04:05',minutes:splitMinutes,split:true});\n   }\n   // Særregel: Fredagsvakt 527177A gir opphold 00:24–07:14 (6 t 50 min).\n   // Registreres separat fra ordinære Fra/Til-koblinger.\n   if(code.toUpperCase()==='527177A'&&new Date(d).getUTCDay()===5&&duty(item,d)){\n    const specialMinutes=6*60+50;\n    minutes+=specialMinutes;stays++;\n    rows.push({date:iso(d),out:code,back:'Opphold 00:24–07:14',minutes:specialMinutes});\n   }\n   if(!code||code==='Dag2'||!duty(item,d)){prev=null;continue}\n   const t=String(item.time||'').match(/^(\\d\\d:\\d\\d)-(\\d\\d:\\d\\d)$/);\n   const start=t?hm(t[1]):null,end=t?hm(t[2]):null;\n   if(prev&&links.has(prev.code+'|'+code)&&d-prev.date===dayMs&&start!==null&&prev.end!==null){\n    // End of outbound duty may be after midnight. The return duty starts next day.\n    const gap=1440+start-prev.end;\n    if(gap>0&&gap\u003c=1440){\n     minutes+=gap;stays++;\n     rows.push({date:iso(prev.date),out:prev.code,back:code,minutes:gap});\n    }\n   }\n   prev={date:d,code,end:end===null?null:end+(start!==null&&end\u003cstart?1440:0)};\n  }\n }\n // A-DelDU: green interval in the official strekliste; A-DelDH excluded.\n const delduRules=[{\"code\":\"522518\",\"days\":[0],\"from\":\"23:12\",\"to\":\"04:52\",\"minutes\":340,\"page\":31},{\"code\":\"522590\",\"days\":[0],\"from\":\"15:47\",\"to\":\"19:36\",\"minutes\":229,\"page\":32}];\n for(const d of allDates){\n  const wd=new Date(d).getUTCDay();\n  const e=datum(roster,week,d),items=Array.isArray(e)?e:[e];\n  for(const item of items){\n   const code=String(item?.code||'').trim();\n   if(!duty(item,d))continue;\n   const rule=delduRules.find(x=>x.code.toUpperCase()===code.toUpperCase()&&x.days.includes(wd));\n   if(!rule)continue;\n   minutes+=rule.minutes;stays++;\n   rows.push({date:iso(d),out:code,back:'A-DelDU',minutes:rule.minutes,split:true});\n  }\n }\n return {minutes,stays,rows};\n}\nfunction layoverStats(){\n const r=layoverSummary(state.roster,state.start);\n const fmt=n=>(n/60).toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2});\n const monthly={};\n for(const x of r.rows){const month=x.date.slice(0,7);if(!monthly[month])monthly[month]={ordinary:0,split:0};monthly[month][x.split?'split':'ordinary']+=x.minutes;}\n const monthRows=Object.entries(monthly).sort(([a],[b])=>a.localeCompare(b)).map(([month,v])=>'\u003ctr>\u003ctd>'+safe(month)+'\u003c/td>\u003ctd>'+fmt(v.ordinary)+'\u003c/td>\u003ctd>'+fmt(v.split)+'\u003c/td>\u003c/tr>').join('');\n const details=r.rows.map(x=>'\u003ctr>\u003ctd>'+safe(x.date)+'\u003c/td>\u003ctd>'+safe(x.out)+'\u003c/td>\u003ctd>'+safe(x.back)+'\u003c/td>\u003ctd>'+Math.floor(x.minutes/60)+' t '+String(x.minutes%60).padStart(2,'0')+' min\u003c/td>\u003c/tr>').join('');\n return '\u003cdiv style=\"margin-top:20px\">\u003ch3>🏨 Oppholdstillegg – utestasjon\u003c/h3>'+\n '\u003cp>\u003cstrong>Oppholdstillegg totalt: '+fmt(r.minutes)+' timer\u003c/strong> (inkludert registrerte delte dagsverk på utestasjon) · '+r.stays+' registrerte opphold.\u003c/p>'+\n '\u003cp class=\"hint\">Viser antall timer som grunnlag for prosenttillegg av din egen timelønn, på samme måte som natt- og helgetillegg. Ingen timelønn eller prosentsats er nødvendig. Beregningen bygger på kjente Fra/Til-koblinger på påfølgende dager og er foreløpig ikke komplett kvalitetssikret mot strekklisten. Ferie og H=fri tas hensyn til.\u003c/p>'+\n '\u003ctable class=\"comparison-table\">\u003cthead>\u003ctr>\u003cth>Måned (første dagsverk)\u003c/th>\u003cth>Opphold (timer)\u003c/th>\u003cth>Delt dagsverk (timer)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+monthRows+'\u003c/tbody>\u003c/table>'+\n (details?'\u003cdetails style=\"margin-top:12px\">\u003csummary>Vis de '+r.stays+' beregnede oppholdene\u003c/summary>\u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"comparison-table\">\u003cthead>\u003ctr>\u003cth>Dato\u003c/th>\u003cth>Til-vakt\u003c/th>\u003cth>Fra-vakt\u003c/th>\u003cth>Opphold\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+details+'\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>':'\u003cp class=\"hint\">Ingen opphold funnet med de registrerte koblingene.\u003c/p>')+'\u003c/div>';\n}\nfunction statistics(){let r=analyze(state.roster,state.start);get('extraStats').innerHTML=metric('Antall oppmøter',r.attendance)+metric('Tidligvakter',r.early)+metric('Senvakter',r.late)+metric('Nattvakter',r.night)+metric('Arbeidsdager helg',r.weekendWork)+metric('Frihelger',r.weekendFree)+metric('R-vakter',r.rDuty)+metric('Kompdager',r.comp)+metric('Merkedager fri',r.markedFree+' / '+r.markedTotal)+supplementStats()+layoverStats()}\nconst allowedKey='turnus-r27-rank-allowed-trondheim';\nlet allowedRank=new Set(Array.from({length:13},(_,i)=>i+1));\ntry{let saved=JSON.parse(localStorage.getItem(allowedKey));if(Array.isArray(saved)&&saved.every(x=>Number.isInteger(x)&&x>=1&&x\u003c=13))allowedRank=new Set(saved)}catch(e){}\nfunction drawRankAllowed(){get('rankAllowed').innerHTML=Array.from({length:13},(_,i)=>{let r=i+1;return '\u003clabel style=\"display:flex;flex-direction:row;align-items:center;gap:7px;background:white;border:1px solid #dce5ed;padding:8px;border-radius:8px\">\u003cinput type=\"checkbox\" data-allowed=\"'+r+'\" '+(allowedRank.has(r)?'checked':'')+'> Turnus '+r+'\u003c/label>'}).join('')}\nfunction updateRankAllowed(){try{localStorage.setItem(allowedKey,JSON.stringify([...allowedRank]))}catch(e){}drawRankAllowed();ranking()}\ndrawRankAllowed();\nget('rankAllowed').addEventListener('change',e=>{let v=Number(e.target.dataset.allowed);if(!v)return;if(e.target.checked)allowedRank.add(v);else allowedRank.delete(v);updateRankAllowed()});\nget('rankAll').onclick=()=>{allowedRank=new Set(Array.from({length:13},(_,i)=>i+1));updateRankAllowed()};\nget('rankNone').onclick=()=>{allowedRank.clear();updateRankAllowed()};\nfunction ranking(){let w={weekend:+get('weightWeekend').value,comp:+get('weightComp').value,night:+get('weightNight').value,early:+get('weightEarly').value,late:+get('weightLate').value,attendance:+get('weightAttendance').value};let rows=[];for(let r=1;r\u003c=13;r++)if(allowedRank.has(r))for(let week=1;week\u003c=6;week++){let m=analyze(r,week);rows.push({r,week,m})}if(!rows.length){get('ranking').innerHTML='\u003cp class=\"hint\">Velg minst én turnus for å se rangeringen.\u003c/p>';return}let metrics=['weekendFreeDays','comp','night','early','late','attendance'];let min={},max={};for(let key of metrics){min[key]=Math.min(...rows.map(x=>x.m[key]));max[key]=Math.max(...rows.map(x=>x.m[key]))}for(let x of rows){let norm=(key,reverse)=>{let range=max[key]-min[key];return range?((reverse?max[key]-x.m[key]:x.m[key]-min[key])/range):0.5};x.score=100*(w.weekend*norm('weekendFreeDays',false)+w.comp*norm('comp',false)+w.night*norm('night',true)+w.early*norm('early',true)+w.late*norm('late',true)+w.attendance*norm('attendance',true))/(w.weekend+w.comp+w.night+w.early+w.late+w.attendance||1)}rows.sort((a,b)=>b.score-a.score||a.r-b.r||a.week-b.week);get('ranking').innerHTML='\u003cp class=\"hint\">Viser de høyest rangerte av '+rows.length+' aktuelle kombinasjoner. Klikk «Velg» for å åpne alternativet i årsoversikten.\u003c/p>\u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"rank-table\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Turnus\u003c/th>\u003cth>Uke\u003c/th>\u003cth>Poeng\u003c/th>\u003cth>Fridager helg\u003c/th>\u003cth>Kompdager\u003c/ h1>\u003cp>3 turnuser · 6/3 startuker · 14.12.2026–12.12.2027\u003c/p>\u003c/header>\u003cmain class=\"wrap\">\u003csection class=\"controls\">\u003clabel>Turnus\u003cselect id=\"roster\">\u003c/select>\u003c/label>\u003clabel>Startuke 14. desember\u003cselect id=\"start\">\u003c/select>\u003c/label>\u003clabel class=\"switch\">\u003cinput type=\"checkbox\" id=\"hfree\"> H fri (ellers H jobb)\u003c/label>\u003cbutton id=\"reset\" type=\"button\">Nullstill mine valg\u003c/button>\u003c/section>\u003csection class=\"stats\">\u003cdiv class=\"stat\">\u003cstrong id=\"daysOff\">–\u003c/strong>Fridager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"workDays\">–\u003c/strong>Vaktdager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"attendanceTop\">–\u003c/strong>Antall oppmøter\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"vacDays\">–\u003c/strong>Feriedager registrert\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"redFreeDays\">–\u003c/strong>Kompdager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"hDays\">–\u003c/strong>H-dager\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch2 style=\"margin-top:0;font-size:19px\">🏖️ Min ferie\u003c/h2>\u003cdiv class=\"vacbox\">\u003clabel>Fra dato\u003cinput id=\"from\" type=\"date\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003clabel>Til dato\u003cinput id=\"to\" type=\"date\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003cbutton class=\"primary\" id=\"addvac\">Legg til ferie\u003c/button>\u003cbutton id=\"clearvac\">Slett all ferie\u003c/button>\u003c/div>\u003cdiv id=\"vaclist\" class=\"vaclist\">\u003c/div>\u003cp class=\"help\">Ferie markeres med en gul ramme. Den opprinnelige vakten vises fortsatt. Opplysningene lagres bare i denne nettleseren på denne enheten.\u003c/p>\u003c/section>\u003cnav class=\"extra-nav\" aria-label=\"Flere funksjoner\">\u003cbutton class=\"active\" data-tab=\"overview\">📅 Årsoversikt\u003c/button>\u003cbutton data-tab=\"compare\">⚖️ Sammenlign\u003c/button>\u003cbutton data-tab=\"stats\">📊 Statistikk\u003c/button>\u003cbutton data-tab=\"rank\">🏆 Finn beste turnus\u003c/button>\u003cbutton data-tab=\"dates\">💜 Merkedager\u003c/button>\u003cbutton data-tab=\"tools\">💾 Eksport og utskrift\u003c/button>\u003c/nav>\n\u003csection id=\"extra-compare\" class=\"card extra-panel\">\u003ch2>⚖️ Sammenlign turnuser\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Alternativ A – turnus\u003cselect id=\"cmpRosterA\">\u003c/select>\u003c/label>\u003clabel>Startuke\u003cselect id=\"cmpWeekA\">\u003c/select>\u003c/label>\u003clabel>Alternativ B – turnus\u003cselect id=\"cmpRosterB\">\u003c/select>\u003c/label>\u003clabel>Startuke\u003cselect id=\"cmpWeekB\">\u003c/select>\u003c/label>\u003c/div>\u003cp class=\"hint\">Begge alternativer bruker samme H-innstilling, ferie og merkedager. Tallene gjelder 14.12.2026–12.12.2027.\u003c/p>\u003cdiv id=\"comparisonResult\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-stats\" class=\"card extra-panel\">\u003ch2>📊 Detaljert turnusstatistikk\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Tidligvakt starter før\u003cinput id=\"earlyLimit\" type=\"time\" value=\"07:00\">\u003c/label>\u003clabel>Senvakt er ferdig etter\u003cinput id=\"lateLimit\" type=\"time\" value=\"20:00\">\u003c/label>\u003clabel>Nattvakt fra\u003cinput id=\"nightFrom\" type=\"time\" value=\"01:20\">\u003c/label>\u003clabel>Nattvakt til\u003cinput id=\"nightTo\" type=\"time\" value=\"04:45\">\u003c/label>\u003c/div>\u003cdiv id=\"extraStats\">\u003c/div>\u003cp class=\"hint\">Nattvakt: velg selv tidsrommet som hele vakten må dekke (standard 01:20–04:45). Vakt 527177A telles aldri som nattvakt. Arbeidsdager helg: hver lørdag og søndag med arbeidsvakt telles som én arbeidsdag (to arbeidsdager dersom begge dager har vakt). Dag2 telles ikke som egen vakt. Ferie fjerner planlagte vakter fra statistikken.\u003c/p>\u003c/section>\n\u003csection id=\"extra-rank\" class=\"card extra-panel\">\u003ch2>🏆 Finn min beste turnus\u003c/h2>\u003cp class=\"hint\">Velg hva du prioriterer. Alle valgte turnuser og startuker vurderes. Poeng er en veiledende rangering, ikke en offisiell turnusvurdering.\u003c/p>\u003cdiv class=\"row\">\u003clabel>Flest fridager helg\u003cselect id=\"weightWeekend\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Flest kompdager\u003cselect id=\"weightComp\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest nattvakter\u003cselect id=\"weightNight\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest tidligvakter\u003cselect id=\"weightEarly\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest oppmøter\u003cselect id=\"weightAttendance\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest senvakter\u003cselect id=\"weightLate\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv class=\"badge-note\">\u003cstrong>Hvilke turnuser kan du søke?\u003c/strong>\u003cp class=\"hint\">Fjern avhukingen for turnuser du ikke har kompetanse til. Bare avhukede turnuser blir rangert.\u003c/p>\u003cdiv class=\"row\">\u003cbutton type=\"button\" id=\"rankAll\">Velg alle\u003c/button>\u003cbutton type=\"button\" id=\"rankNone\">Fjern alle\u003c/button>\u003c/div>\u003cdiv id=\"rankAllowed\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin:12px 0\">\u003c/div>\u003c/div>\u003cdiv id=\"ranking\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-dates\" class=\"card extra-panel\">\u003ch2>💜 Mine private merkedager\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Dato\u003cinput type=\"date\" id=\"importantDate\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003clabel>Beskrivelse\u003cinput id=\"importantText\" maxlength=\"80\" placeholder=\"F.eks. bursdag\">\u003c/label>\u003cbutton class=\"primary\" id=\"addImportant\">Legg til\u003c/button>\u003c/div>\u003cdiv id=\"importantList\">\u003c/div>\u003cp class=\"hint\">Merkedagene vises med lilla ramme i kalenderen og beholdes når du prøver en annen turnus. Opplysningene lagres bare lokalt.\u003c/p>\u003c/section>\n\u003csection id=\"extra-tools\" class=\"card extra-panel\">\u003ch2>💾 Sikkerhetskopi, PDF og installasjon\u003c/h2>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"exportData\">Eksporter mine data (.json)\u003c/button>\u003clabel>Importer sikkerhetskopi\u003cinput id=\"importData\" type=\"file\" accept=\".json,application/json\">\u003c/label>\u003cbutton id=\"printYear\">🖨️ Skriv ut / lagre som PDF\u003c/button>\u003cbutton id=\"installApp\" hidden>📱 Installer app\u003c/button>\u003c/div>\u003cp class=\"help\">Eksporten inneholder personlige valg, ferie og merkedager. Oppbevar filen privat. Import erstatter eksisterende valg. For installasjon på hjemskjermen må appen publiseres via HTTPS med de tilhørende PWA-filene. Åpning som lokal HTML-fil støtter ikke full PWA-installasjon.\u003c/p>\u003c/section>\n\u003cdiv id=\"printHeading\" class=\"print-only\">\u003c/div>\u003cdiv class=\"toolbar\" id=\"calendarToolbar\">\u003ch2>Årsoversikt\u003c/h2>\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"dot green\">\u003c/i>Fri (O/X/T, ev. H)\u003c/span>\u003cspan>\u003ci class=\"dot work\">\u003c/i>Vakt / Dag2\u003c/span>\u003cspan>\u003ci class=\"dot vac\">\u003c/i>Ferie\u003c/span>\u003c/div>\u003c/div>\u003cdiv id=\"months\" class=\"months\">\u003c/div>\u003csection id=\"detail\" class=\"detail\" aria-live=\"polite\">Trykk på en dato for detaljer om vakten.\u003c/section>\u003cdiv class=\"foot\">Grunnlag: K-Stk 1–3 R27, versjon 16.10.2026. Dag2 vises som egen kode uten grønn fridagsmarkering. Vaktene er hentet fra PDF-grunnlaget; kontroller alltid gjeldende offisiell turnus ved avvik.\u003c/div>\u003c/main>\u003cscript>\nconst DATA=[[[{\"code\":\"O\",\"time\":\"\"},{\"code\":\"54H060O\",\"time\":\"06:00-15:00\"},{\"code\":\"542662\",\"time\":\"05:44-14:37\"},{\"code\":\"542662\",\"time\":\"05:44-14:37\"},{\"code\":\"542642\",\"time\":\"15:16-23:34\"},{\"code\":\"T\",\"time\":\"\"},{\"code\":\"54R0713\",\"time\":\"07:13-16:40\"}],[{\"code\":\"54R0513\",\"time\":\"05:13-12:00\"},{\"code\":\"54R0600\",\"time\":\"06:00-15:00\"},{\"code\":\"542660\",\"time\":\"04:44-10:37\"},{\"code\":\"T\",\"time\":\"\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"O\",\"time\":\"\"}],[{\"code\":\"O\",\"time\":\"\"},{\"code\":\"T\",\"time\":\"\"},{\"code\":\"T\",\"time\":\"\"},{\"code\":\"54R1515\",\"time\":\"15:15-00:15\"},{\"code\":\"542644\",\"time\":\"16:11-00:33\"},{\"code\":\"542642L\",\"time\":\"15:16-23:34\"},{\"code\":\"54R1415\",\"time\":\"14:15-23:40\"}],[{\"code\":\"54R1515\",\"time\":\"15:15-00:15\"},{\"code\":\"54R1515\",\"time\":\"15:15-00:15\"},{\"code\":\"542644\",\"time\":\"16:11-00:33\"},{\"code\":\"Dag2\",\"time\":\"\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"O\",\"time\":\"\"}],[{\"code\":\"54R0600\",\"time\":\"06:00-15:00\"},{\"code\":\"542660\",\"time\":\"04:44-10:37\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"O\",\"time\":\"\"},{\"code\":\"54R1515\",\"time\":\"15:15-00:40\"},{\"code\":\"54R1515\",\"time\":\"15:15-23:35\"},{\"code\":\"542642S\",\"time\":\"15:16-00:33\" s(e.code)||(state.hfree&&e.code.includes('H'))}\nfunction vacation(d){return onVacation(d)}\nfunction duty(e,d){return !free(e)&&!(e.code==='Dag2'&&dag2FriFor(d))&&!vacation(d)}\nfunction hm(time){return time?Number(time.slice(0,2))*60+Number(time.slice(3,5)):null}\nfunction limits(){return {early:hm(get('earlyLimit').value)??420,late:hm(get('lateLimit').value)??840,nightFrom:hm(get('nightFrom').value)??80,nightTo:hm(get('nightTo').value)??285}}\nfunction coversNight(a,b,from,to){if(a===null||b===null||from===to)return false;let end=b\u003c=a?b+1440:b;for(let k=-1;k\u003c=1;k++){let start=from+k*1440,finish=to+k*1440+(to\u003c=from?1440:0);if(a\u003c=start&&end>=finish)return true}return false}\nconst nightSettingsKey='turnusvelger-r27-steinkjer-night-range';try{let z=JSON.parse(localStorage.getItem(nightSettingsKey)||'null');if(z&&/^([01]\\d|2[0-3]):[0-5]\\d$/.test(z.from)&&/^([01]\\d|2[0-3]):[0-5]\\d$/.test(z.to)){get('nightFrom').value=z.from;get('nightTo').value=z.to}}catch(e){}\nconst attendanceLinks=new Set([]);\nfunction attendanceCount(roster,week){\n let count=0,previous=null;\n for(const d of allDates){\n  const e=datum(roster,week,d),items=Array.isArray(e)?e:[e];\n  for(const item of items){\n   const code=String(item?.code||'').trim();\n   if(!code||code==='Dag2'||!duty(item,d)){previous=null;continue}\n   if(!(previous&&attendanceLinks.has(previous+'|'+code)))count++;\n   previous=code;\n  }\n }\n return count;\n}\nfunction analyze(roster,week){let r={off:0,work:0,comp:0,h:0,early:0,late:0,night:0,rDuty:0,weekendWork:0,weekendFree:0,weekendFreeDays:0,markedFree:0,markedTotal:state.important.length,attendance:attendanceCount(roster,week)};let {early,late,nightFrom,nightTo}=limits();let weekends={};for(let d of allDates){let e=datum(roster,week,d),f=free(e),v=vacation(d),s=iso(d);if(f||v||(e.code==='Dag2'&&dag2FriFor(d)))r.off++;else r.work++;if(e.code.includes('H'))r.h++;if(HOLIDAYS.has(s)&&f)r.comp++;if(state.important.some(m=>m.date===s)&&(f||v))r.mark ),b=hm(parts[1]);if(a===null||b===null||!Number.isFinite(a)||!Number.isFinite(b))continue;\n  let start=d+a*60000,end=d+b*60000;if(end\u003c=start)end+=86400000;\n  // Segmenter ved midnatt og ved tariffgrensene 05, 06 og 20.\n  for(let t=start;t\u003cend;){\n   let day=Math.floor(t/86400000)*86400000;\n   let candidates=[day+5*3600000,day+6*3600000,day+20*3600000,day+86400000,end];\n   let next=Math.min(...candidates.filter(x=>x>t));\n   let mid=t+(next-t)/2,localDay=Math.floor(mid/86400000)*86400000;\n   let wd=new Date(localDay).getUTCDay(),minutes=(mid-localDay)/60000;\n   let isNight=minutes>=1200||minutes\u003c360;\n   let isWeekend=(wd===5&&minutes>=1200)||wd===6||wd===0||(wd===1&&minutes\u003c300);\n   let from=Math.max(t,yearStart),to=Math.min(next,yearEnd),hours=Math.max(0,to-from)/3600000;\n   if(hours){let month=new Date(from).toISOString().slice(0,7);let m=monthly[month]??(monthly[month]={night:0,weekend:0});if(isNight){night+=hours;m.night+=hours}if(isWeekend){weekend+=hours;m.weekend+=hours}}\n   t=next;\n  }\n }\n return {night,weekend,monthly};\n}\nfunction supplementStats(){\n const v=supplementHours(state.roster,state.start),fmt=n=>n.toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2});\n const rows=Object.entries(v.monthly).sort(([a],[b])=>a.localeCompare(b)).map(([month,x])=>'\u003ctr>\u003ctd>'+month+'\u003c/td>\u003ctd>'+fmt(x.night)+'\u003c/td>\u003ctd>'+fmt(x.weekend)+'\u003c/td>\u003c/tr>').join('');\n return '\u003cdiv style=\"margin-top:20px\">\u003ch3>🌙 Natt- og helgetillegg\u003c/h3>\u003cp>Nattillegg: 20:00–06:00 hver dag. Helgetillegg: fredag 20:00–mandag 05:00. Overlappende timer telles i begge kategorier. Beregnet fra hele oppsatte vakter, ekskludert registrert ferie/fridager.\u003c/p>\u003cdiv class=\"row\">'+metric('Nattillegg, timer',fmt(v.night))+metric('Helgetillegg, timer',fmt(v.weekend))+'\u003c/div>\u003ch4>Fordelt per måned\u003c/h4>\u003ctable style=\"width:100%;text-align:left\">\u003cthead>\u003ctr>\ {minutes,stays,rows};\n}\nfunction layoverStats(){\n const r=layoverSummary(state.roster,state.start);\n const fmt=n=>(n/60).toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2});\n const monthly={};\n for(const x of r.rows){const month=x.date.slice(0,7);if(!monthly[month])monthly[month]={ordinary:0,split:0};monthly[month][x.split?'split':'ordinary']+=x.minutes;}\n const monthRows=Object.entries(monthly).sort(([a],[b])=>a.localeCompare(b)).map(([month,v])=>'\u003ctr>\u003ctd>'+safe(month)+'\u003c/td>\u003ctd>'+fmt(v.ordinary)+'\u003c/td>\u003ctd>'+fmt(v.split)+'\u003c/td>\u003c/tr>').join('');\n const details=r.rows.map(x=>'\u003ctr>\u003ctd>'+safe(x.date)+'\u003c/td>\u003ctd>'+safe(x.out)+'\u003c/td>\u003ctd>'+safe(x.back)+'\u003c/td>\u003ctd>'+Math.floor(x.minutes/60)+' t '+String(x.minutes%60).padStart(2,'0')+' min\u003c/td>\u003c/tr>').join('');\n return '\u003cdiv style=\"margin-top:20px\">\u003ch3>🏨 Oppholdstillegg – utestasjon\u003c/h3>'+\n '\u003cp>\u003cstrong>Oppholdstillegg totalt: '+fmt(r.minutes)+' timer\u003c/strong> (inkludert registrerte delte dagsverk på utestasjon) · '+r.stays+' registrerte opphold.\u003c/p>'+\n '\u003cp class=\"hint\">Viser antall timer som grunnlag for prosenttillegg av din egen timelønn, på samme måte som natt- og helgetillegg. Ingen timelønn eller prosentsats er nødvendig. Beregningen bygger på kjente Fra/Til-koblinger på påfølgende dager og er foreløpig ikke komplett kvalitetssikret mot strekklisten. Ferie og H=fri tas hensyn til.\u003c/p>'+\n '\u003ctable class=\"comparison-table\">\u003cthead>\u003ctr>\u003cth>Måned (første dagsverk)\u003c/th>\u003cth>Opphold (timer)\u003c/th>\u003cth>Delt dagsverk (timer)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+monthRows+'\u003c/tbody>\u003c/table>'+\n (details?'\u003cdetails style=\"margin-top:12px\">\u003csummary>Vis de '+r.stays+' beregnede oppholdene\u003c/summary>\u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"comparison-table\">\u003cthead>\u003ctr>\u c/h2>\u003cdiv class=\"row\">\u003clabel>Alternativ A – turnus\u003cselect id=\"cmpRosterA\">\u003c/select>\u003c/label>\u003clabel>Startuke\u003cselect id=\"cmpWeekA\">\u003c/select>\u003c/label>\u003clabel>Alternativ B – turnus\u003cselect id=\"cmpRosterB\">\u003c/select>\u003c/label>\u003clabel>Startuke\u003cselect id=\"cmpWeekB\">\u003c/select>\u003c/label>\u003c/div>\u003cp class=\"hint\">Begge alternativer bruker samme H-innstilling, ferie og merkedager. Tallene gjelder 14.12.2026–12.12.2027.\u003c/p>\u003cdiv id=\"comparisonResult\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-stats\" class=\"card extra-panel\">\u003ch2>📊 Detaljert turnusstatistikk\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Tidligvakt starter før\u003cinput id=\"earlyLimit\" type=\"time\" value=\"07:00\">\u003c/label>\u003clabel>Senvakt er ferdig etter\u003cinput id=\"lateLimit\" type=\"time\" value=\"20:00\">\u003c/label>\u003clabel>Nattvakt fra\u003cinput id=\"nightFrom\" type=\"time\" value=\"01:20\">\u003c/label>\u003clabel>Nattvakt til\u003cinput id=\"nightTo\" type=\"time\" value=\"04:45\">\u003c/label>\u003c/div>\u003cdiv id=\"extraStats\">\u003c/div>\u003cp class=\"hint\">Nattvakt: velg selv tidsrommet som hele vakten må dekke (standard 01:20–04:45). Vakt 527177A telles aldri som nattvakt. Arbeidsdager helg: hver lørdag og søndag med arbeidsvakt telles som én arbeidsdag (to arbeidsdager dersom begge dager har vakt). Dag2 telles ikke som egen vakt. Ferie fjerner planlagte vakter fra statistikken.\u003c/p>\u003c/section>\n\u003csection id=\"extra-rank\" class=\"card extra-panel\">\u003ch2>🏆 Finn min beste turnus\u003c/h2>\u003cp class=\"hint\">Velg hva du prioriterer. Alle 78 kombinasjonene vurderes. Poeng er en veiledende rangering, ikke en offisiell turnusvurdering.\u003c/p>\u003cdiv class=\"row\">\u003clabel>Flest fridager helg\u003cselect id=\"weightWeekend\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Flest kompdager\u003cselect id=\"weightComp\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest nattvakter\u003cselect id=\"weightNight\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest tidligvakter\u003cselect id=\"weightEarly\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest oppmøter\u003cselect id=\"weightAttendance\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest senvakter\u003cselect id=\"weightLate\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv id=\"ranking\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-dates\" class=\"card extra-panel\">\u003ch2>💜 Mine private merkedager\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Dato\u003cinput type=\"date\" id=\"importantDate\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003clabel>Beskrivelse\u003cinput id=\"importantText\" maxlength=\"80\" placeholder=\"F.eks. bursdag\">\u003c/label>\u003cbutton class=\"primary\" id=\"addImportant\">Legg til\u003c/button>\u003c/div>\u003cdiv id=\"importantList\">\u003c/div>\u003cp class=\"hint\">Merkedagene vises med lilla ramme i kalenderen og beholdes når du prøver en annen turnus. Opplysningene lagres bare lokalt.\u003c/p>\u003c/section>\n\u003csection id=\"extra-tools\" class=\"card extra-panel\">\u003ch2>💾 Sikkerhetskopi, PDF og installasjon\u003c/h2>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"exportData\">Eksporter mine data (.json)\u003c/button>\u003clabel>Importer sikkerhetskopi\u003cinput id=\"importData\" type=\"file\" accept=\".json,application/json\">\u003c/label>\u003cbutton id=\"printYear\">🖨️ Skriv ut / lagre som PDF\u003c/button>\u003cbutton id=\"installApp\" hidden>📱 Installer app\u003c/button>\u003c/div>\u003cp class=\"help\">Eksporten inneholder personlige valg, ferie og merkedager. Oppbevar filen privat. Import erstatter eksisterende valg. For installasjon på hjemskjermen må appen publiseres via HTTPS med de tilhørende PWA-filene. Åpning som lokal HTML-fil støtter ikke full PWA-installasjon.\u003c/p>\u003c/section>\n\u003cdiv id=\"printHeading\" class=\"print-only\">\u003c/div>\u003cdiv class=\"toolbar\" id=\"calendarToolbar\">\u003ch2>Årsoversikt\u003c/h2>\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"dot green\">\u003c/i>Fri (O/X/T, ev. H)\u003c/span>\u003cspan>\u003ci class=\"dot work\">\u003c/i>Vakt / Dag2\u003c/span>\u003cspan>\u003ci class=\"dot vac\">\u003c/i>Ferie\u003c/span>\u003c/div>\u003c/div>\u003cdiv id=\"months\" class=\"months\">\u003c/div>\u003csection id=\"detail\" class=\"detail\" aria-live=\"polite\">Trykk på en dato for detaljer om vakten.\u003c/section>\u003cdiv class=\"foot\">Grunnlag: K-Stk 1–3 R27, versjon 16.10.2026. Dag2 vises som egen kode uten grønn fridagsmarkering. Vaktene er hentet fra PDF-grunnlaget; kontroller alltid gjeldende offisiell turnus ved avvik.\u003c/div>\u003c/main>\u003cscript>\nconst DATA=[[[{\"code\":\"O\",\"time\":\"\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"567171\",\"time\":\"12:59-01:43\"},{\"code\":\"567171\",\"time\":\"12:59-01:43\"},{\"code\":\"Dag2\",\"time\":\"\"},{\"code\":\"567176A\",\"time\":\"01:17-10:42\",\"shifts\":[{\"code\":\"567176A\",\"time\":\"01:17-10:42\"},{\"code\":\"567176\",\"time\":\"20:22-01:43\"}]},{\" :\"567173\",\"time\":\"06:15-17:03\"},{\"code\":\"56R1700\",\"time\":\"17:00-01:00\"},{\"code\":\"56R1700\",\"time\":\"17:00-01:00\"}],[{\"code\":\"56R1700\",\"time\":\"17:00-01:00\"},{\"code\":\"Dag2\",\"time\":\"\"},{\"code\":\"T\",\"time\":\"\"},{\"code\":\"567183A\",\"time\":\"06:15-17:03\"},{\"code\":\"567175A\",\"time\":\"04:24-17:01\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"O\",\"time\":\"\"}]]];\nconst KEY='mosjoen_r27_private_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}};\nstate.roster=(Number.isInteger(state.roster)&&state.roster>=1&&state.roster\u003c=1)?state.roster:1;state.start=(Number.isInteger(state.start)&&state.start>=1&&state.start\u003c=DATA[state.roster-1].length)?state.start:1;state.hfree=!!state.hfree;state.vacations=Array.isArray(state.vacations)?state.vacations:[];\nconst $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){/* Behold valg i denne økten. */}};\nconst startUTC=Date.UTC(2026,11,14),endUTC=Date.UTC(2027,11,12),MS=86400000;\nconst iso=d=>new Date(d).toISOString().slice(0,10);const dayNumber=d=>Math.round((d-startUTC)/MS);const dateLabel=s=>new Date(s+'T12:00:00Z').toLocaleDateString('nb-NO',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});\nconst HOLIDAYS=new Set(['2026-12-25','2026-12-26','2027-01-01','2027-03-25','2027-03-26','2027-03-27','2027-03-29','2027-05-01','2027-05-06','2027-05-17']);\nfunction entry(d){let n=dayNumber(d);if(n\u003c0||d>endUTC)return null;let w=(state.start-1+Math.floor(n/7))%DATA[state.roster-1].length;return {...DATA[state.roster-1][w][n%7],week:w+1}}\nfunction isFree(e){return ['O','X','T'].includes(e.code)||(state.hfree&&e.code.includes('H'))}\nfunction onVacation(d){let s=iso(d);return state.vacations.some(v=>v.from\u003c=s&&s\u003c=v.to)}\nfunction dag2Fri(d){return d>startUTC&&onVacation(d-MS)}\nfunction dag2FriFor(d){return d>startUTC&&onVacation(d-MS)}\n\n// Beregning for aarsoversikt =='Dag2'&&dag2Fri(d)),v=onVacation(d),s=iso(d),shownCode=(e.code==='Dag2'&&dag2Fri(d)?'Fri':e.code);html+='\u003cdiv role=\"button\" tabindex=\"0\" class=\"cell '+(free?'off ':'')+(v?'vacation ':'')+(HOLIDAYS.has(s)?'holiday':'')+'\" data-date=\"'+s+'\" title=\"'+s+' · '+shownCode+' '+e.time+(e.shifts?' · '+e.shifts[1].code+' '+e.shifts[1].time:'')+'\">\u003cdiv class=\"num\">'+new Date(d).getUTCDate()+'\u003c/div>\u003cdiv class=\"code '+(e.code.includes('R')?'r-duty':'')+'\">'+shownCode+'\u003c/div>\u003cdiv class=\"time\">'+e.time+'\u003c/div>'+(e.shifts&&e.shifts.length>1?e.shifts.slice(1).map(sh=>'\u003cdiv class=\"code second-shift\">'+sh.code+'\u003c/div>\u003cdiv class=\"time second-time\">'+sh.time+'\u003c/div>').join(''):'')+(v?'\u003cspan class=\"badge\">Ferie\u003c/span>':'')+'\u003c/div>'}html+='\u003c/div>\u003c/article>'} $('months').innerHTML=html;\n$('vaclist').innerHTML=state.vacations.length?state.vacations.map((v,i)=>'\u003cspan class=\"vacitem\">'+dateLabel(v.from)+' – '+dateLabel(v.to)+' \u003cbutton aria-label=\"Slett ferie\" data-remove=\"'+i+'\">×\u003c/button>\u003c/span>').join(''):'\u003cspan class=\"muted\">Ingen ferie registrert ennå.\u003c/span>';\n}\nfor(let i=1;i\u003c=1;i++)$('roster').add(new Option('Turnus '+i,i));function syncStartWeeks(){let el=$('start'),n=DATA[state.roster-1].length;el.innerHTML='';for(let i=1;i\u003c=n;i++)el.add(new Option('Uke '+i,i));if(state.start>n)state.start=1;el.value=state.start;}syncStartWeeks();$('roster').value=state.roster;$('start').value=state.start;$('hfree').checked=state.hfree;\n$('roster').onchange=e=>{state.roster=+e.target.value;syncStartWeeks();save();render()};$('start').onchange=e=>{state.start=+e.target.value;save();render()};$('hfree').onchange=e=>{state.hfree=e.target.checked;save();render()};\n$('addvac').onclick=()=>{let a=$('from').value,b=$('to').value;if(!a||!b||a>b||a\u003c'2026-12-14'||b>'2027-12-12'){alert('Velg gyldige datoer innenfor turnusåret.');return}state.vacations.pu ==='Dag2'&&dag2FriFor(d))&&!vacation(d)}\nfunction hm(time){return time?Number(time.slice(0,2))*60+Number(time.slice(3,5)):null}\nfunction limits(){return {early:hm(get('earlyLimit').value)??420,late:hm(get('lateLimit').value)??840,nightFrom:hm(get('nightFrom').value)??80,nightTo:hm(get('nightTo').value)??285}}\nfunction coversNight(a,b,from,to){if(a===null||b===null||from===to)return false;let end=b\u003c=a?b+1440:b;for(let k=-1;k\u003c=1;k++){let start=from+k*1440,finish=to+k*1440+(to\u003c=from?1440:0);if(a\u003c=start&&end>=finish)return true}return false}\nconst nightSettingsKey='turnusvelger-r27-mosjoen-night-range';try{let z=JSON.parse(localStorage.getItem(nightSettingsKey)||'null');if(z&&/^([01]\\d|2[0-3]):[0-5]\\d$/.test(z.from)&&/^([01]\\d|2[0-3]):[0-5]\\d$/.test(z.to)){get('nightFrom').value=z.from;get('nightTo').value=z.to}}catch(e){}\nconst attendanceLinks=new Set([\"567173|567176A\", \"567175|567176\", \"567176A|567176a\", \"567176a|567173\"]);\nfunction attendanceCount(roster,week){\n let count=0,previous=null;\n for(const d of allDates){\n  const e=datum(roster,week,d),items=Array.isArray(e)?e:[e];\n  for(const item of items){\n   const code=String(item?.code||'').trim();\n   if(!code||code==='Dag2'||!duty(item,d)){previous=null;continue}\n   if(!(previous&&attendanceLinks.has(previous+'|'+code)))count++;\n   previous=code;\n  }\n }\n return count;\n}\nfunction analyze(roster,week){let r={off:0,work:0,comp:0,h:0,early:0,late:0,night:0,rDuty:0,weekendWork:0,weekendFree:0,weekendFreeDays:0,markedFree:0,markedTotal:state.important.length,attendance:attendanceCount(roster,week)};let {early,late,nightFrom,nightTo}=limits();let weekends={};for(let d of allDates){let e=datum(roster,week,d),f=free(e),v=vacation(d),s=iso(d);if(f||v||(e.code==='Dag2'&&dag2FriFor(d)))r.off++;else r.work++;if(e.code.includes('H'))r.h++;if(HOLIDAYS.has(s)&&f)r.comp++;if(state.important.some(m=>m.date===s)&&(f||v))r.markedFree++;\nlet wd=new Date(d).getUTCDay();if(wd===6||wd===0){ 003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"attendanceTop\">–\u003c/strong>Antall oppmøter\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"vacDays\">–\u003c/strong>Feriedager registrert\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"redFreeDays\">–\u003c/strong>Kompdager\u003c/div>\u003cdiv class=\"stat\">\u003cstrong id=\"hDays\">–\u003c/strong>H-dager\u003c/div>\u003c/section>\u003csection class=\"card\">\u003ch2 style=\"margin-top:0;font-size:19px\">🏖️ Min ferie\u003c/h2>\u003cdiv class=\"vacbox\">\u003clabel>Fra dato\u003cinput id=\"from\" type=\"date\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003clabel>Til dato\u003cinput id=\"to\" type=\"date\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003cbutton class=\"primary\" id=\"addvac\">Legg til ferie\u003c/button>\u003cbutton id=\"clearvac\">Slett all ferie\u003c/button>\u003c/div>\u003cdiv id=\"vaclist\" class=\"vaclist\">\u003c/div>\u003cp class=\"help\">Ferie markeres med en gul ramme. Den opprinnelige vakten vises fortsatt. Opplysningene lagres bare i denne nettleseren på denne enheten.\u003c/p>\u003c/section>\u003cnav class=\"extra-nav\" aria-label=\"Flere funksjoner\">\u003cbutton class=\"active\" data-tab=\"overview\">📅 Årsoversikt\u003c/button>\u003cbutton data-tab=\"compare\">⚖️ Sammenlign\u003c/button>\u003cbutton data-tab=\"stats\">📊 Statistikk\u003c/button>\u003cbutton data-tab=\"rank\">🏆 Finn beste turnus\u003c/button>\u003cbutton data-tab=\"dates\">💜 Merkedager\u003c/button>\u003cbutton data-tab=\"tools\">💾 Eksport og utskrift\u003c/button>\u003c/nav>\n\u003csection id=\"extra-compare\" class=\"card extra-panel\">\u003ch2>⚖️ Sammenlign turnuser\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Alternativ A – turnus\u003cselect id=\"cmpRosterA\">\u003c/select>\u003c/label>\u003clabel>Startuke\u003cselect id=\"cmpWeekA\">\u003c/select>\u003c/label>\u003clabel>Alternativ B – turnus\u003cselect id=\"cmpRosterB\">\u003c/select>\u003c/label>\u003clabel>Startuke\u003cselect id=\"cmpWeekB\">\u003c/select>\u003c/label>\u003c/div>\u003cp class=\"hint\">Begge alternativer bruker samme H-innstilling, ferie og merkedager. Tallene gjelder 14.12.2026–12.12.2027.\u003c/p>\u003cdiv id=\"comparisonResult\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-stats\" class=\"card extra-panel\">\u003ch2>📊 Detaljert turnusstatistikk\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Tidligvakt starter før\u003cinput id=\"earlyLimit\" type=\"time\" value=\"07:00\">\u003c/label>\u003clabel>Senvakt er ferdig etter\u003cinput id=\"lateLimit\" type=\"time\" value=\"20:00\">\u003c/label>\u003clabel>Nattvakt fra\u003cinput id=\"nightFrom\" type=\"time\" value=\"01:20\">\u003c/label>\u003clabel>Nattvakt til\u003cinput id=\"nightTo\" type=\"time\" value=\"04:45\">\u003c/label>\u003c/div>\u003cdiv id=\"extraStats\">\u003c/div>\u003cp class=\"hint\">Nattvakt: velg selv tidsrommet som hele vakten må dekke (standard 01:20–04:45). Vakt 527177A telles aldri som nattvakt. Arbeidsdager helg: hver lørdag og søndag med arbeidsvakt telles som én arbeidsdag (to arbeidsdager dersom begge dager har vakt). Dag2 telles ikke som egen vakt. Ferie fjerner planlagte vakter fra statistikken.\u003c/p>\u003c/section>\n\u003csection id=\"extra-rank\" class=\"card extra-panel\">\u003ch2>🏆 Finn min beste turnus\u003c/h2>\u003cp class=\"hint\">Velg hva du prioriterer. Alle 78 kombinasjonene vurderes. Poeng er en veiledende rangering, ikke en offisiell turnusvurdering.\u003c/p>\u003cdiv class=\"row\">\u003clabel>Flest fridager helg\u003cselect id=\"weightWeekend\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Flest kompdager\u003cselect id=\"weightComp\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest nattvakter\u003cselect id=\"weightNight\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest tidligvakter\u003cselect id=\"weightEarly\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest oppmøter\u003cselect id=\"weightAttendance\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest senvakter\u003cselect id=\"weightLate\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv id=\"ranking\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-dates\" class=\"card extra-panel\">\u003ch2>💜 Mine private merkedager\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Dato\u003cinput type=\"date\" id=\"importantDate\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003clabel>Beskrivelse\u003cinput id=\"importantText\" maxlength=\"80\" placeholder=\"F.eks. bursdag\">\u003c/label>\u003cbutton class=\"primary\" id=\"addImportant\">Legg til\u003c/button>\u003c/div>\u003cdiv id=\"importantList\">\u003c/div>\u003cp class=\"hint\">Merkedagene vises med lilla ramme i kalenderen og beholdes når du prøver en annen turnus. Opplysningene lagres bare lokalt.\u003c/p>\u003c/section>\n\u003csection id=\"extra-tools\" class=\"card extra-panel\">\u003ch2>💾 Sikkerhetskopi, PDF og installasjon\u003c/h2>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"exportData\">Eksporter mine data (.json)\u003c/button>\u003clabel>Importer sikkerhetskopi\u003cinput id=\"importData\" type=\"file\" accept=\".json,application/json\">\u003c/label>\u003cbutton id=\"printYear\">🖨️ Skriv ut / lagre som PDF\u003c/button>\u003cbutton id=\"installApp\" hidden>📱 Installer app\u003c/button>\u003c/div>\u003cp class=\"help\">Eksporten inneholder personlige valg, ferie og merkedager. Oppbevar filen privat. Import erstatter eksisterende valg. For installasjon på hjemskjermen må appen publiseres via HTTPS med de tilhørende PWA-filene. Åpning som lokal HTML-fil støtter ikke full PWA-installasjon.\u003c/p>\u003c/section>\n\u003cdiv id=\"printHeading\" class=\"print-only\">\u003c/div>\u003cdiv class=\"toolbar\" id=\"calendarToolbar\">\u003ch2>Årsoversikt\u003c/h2>\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"dot green\">\u003c/i>Fri (O/X/T, ev. H)\u003c/span>\u003cspan>\u003ci class=\"dot work\">\u003c/i>Vakt / Dag2\u003c/span>\u003cspan>\u003ci class=\"dot vac\">\u003c/i>Ferie\u003c/span>\u003c/div>\u003c/div>\u003cdiv id=\"months\" class=\"months\">\u003c/div>\u003csection id=\"detail\" class=\"detail\" aria-live=\"polite\">Trykk på en dato for detaljer om vakten.\u003c/section>\u003cdiv class=\"foot\">Grunnlag: K-Stk 1–3 R27, versjon 16.10.2026. Dag2 vises som egen kode uten grønn fridagsmarkering. Vaktene er hentet fra PDF-grunnlaget; kontroller alltid gjeldende offisiell turnus ved avvik.\u003c/div>\u003cp style=\"margin:15px auto;max-width:1150px;padding:12px;background:#fff4d7\">Merk: K-Bo2, uke 3, søndag har to dagsverk. Begge er registrert i datagrunnlaget, men beregninger for denne dagen må kontrolleres mot originalturnusen.\u003c/p>\u003c/main>\u003cscript>\nconst DATA=[[[{\"code\":\"O\",\"time\":\"\"},{\"code\":\"607194\",\"time\":\"22:54-06:45\"},{\"code\":\"Dag2\",\"time\":\"\"},{\"code\":\"607183\",\"time\":\"04:16-12:16\"},{\"code\":\"607170\",\"time\":\"07:11-21:14\"},{\"code\":\"607172L\",\"time\":\"10:45-21:00\"},{\"code\":\"T\",\"time\":\"\"}],[{\"code\":\"607183\",\"time\":\"04:16-12:16\"},{\"code\":\"60R1200\",\"time\":\"12:00-21:00\"},{\"code\":\"60R1300\",\"time\":\"13:00-21:0  id=\"comparisonResult\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-stats\" class=\"card extra-panel\">\u003ch2>📊 Detaljert turnusstatistikk\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Tidligvakt starter før\u003cinput id=\"earlyLimit\" type=\"time\" value=\"07:00\">\u003c/label>\u003clabel>Senvakt er ferdig etter\u003cinput id=\"lateLimit\" type=\"time\" value=\"20:00\">\u003c/label>\u003clabel>Nattvakt fra\u003cinput id=\"nightFrom\" type=\"time\" value=\"01:20\">\u003c/label>\u003clabel>Nattvakt til\u003cinput id=\"nightTo\" type=\"time\" value=\"04:45\">\u003c/label>\u003c/div>\u003cdiv id=\"extraStats\">\u003c/div>\u003cp class=\"hint\">Nattvakt: velg selv tidsrommet som hele vakten må dekke (standard 01:20–04:45). Vakt 527177A telles aldri som nattvakt. Arbeidsdager helg: hver lørdag og søndag med arbeidsvakt telles som én arbeidsdag (to arbeidsdager dersom begge dager har vakt). Dag2 telles ikke som egen vakt. Ferie fjerner planlagte vakter fra statistikken.\u003c/p>\u003c/section>\n\u003csection id=\"extra-rank\" class=\"card extra-panel\">\u003ch2>🏆 Finn min beste turnus\u003c/h2>\u003cp class=\"hint\">Velg hva du prioriterer. Alle 78 kombinasjonene vurderes. Poeng er en veiledende rangering, ikke en offisiell turnusvurdering.\u003c/p>\u003cdiv class=\"row\">\u003clabel>Flest fridager helg\u003cselect id=\"weightWeekend\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Flest kompdager\u003cselect id=\"weightComp\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest nattvakter\u003cselect id=\"weightNight\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\" selected>Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest tidligvakter\u003cselect id=\"weightEarly\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest oppmøter\u003cselect id=\"weightAttendance\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003clabel>Færrest senvakter\u003cselect id=\"weightLate\">\u003coption value=\"0\">Ikke viktig\u003c/option>\u003coption value=\"1\">Viktig\u003c/option>\u003coption value=\"3\">Svært viktig\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cdiv id=\"ranking\">\u003c/div>\u003c/section>\n\u003csection id=\"extra-dates\" class=\"card extra-panel\">\u003ch2>💜 Mine private merkedager\u003c/h2>\u003cdiv class=\"row\">\u003clabel>Dato\u003cinput type=\"date\" id=\"importantDate\" min=\"2026-12-14\" max=\"2027-12-12\">\u003c/label>\u003clabel>Beskrivelse\u003cinput id=\"importantText\" maxlength=\"80\" placeholder=\"F.eks. bursdag\">\u003c/label>\u003cbutton class=\"primary\" id=\"addImportant\">Legg til\u003c/button>\u003c/div>\u003cdiv id=\"importantList\">\u003c/div>\u003cp class=\"hint\">Merkedagene vises med lilla ramme i kalenderen og beholdes når du prøver en annen turnus. Opplysningene lagres bare lokalt.\u003c/p>\u003c/section>\n\u003csection id=\"extra-tools\" class=\"card extra-panel\">\u003ch2>💾 Sikkerhetskopi, PDF og installasjon\u003c/h2>\u003cdiv class=\"row\">\u003cbutton class=\"primary\" id=\"exportData\">Eksporter mine data (.json)\u003c/button>\u003clabel>Importer sikkerhetskopi\u003cinput id=\"importData\" type=\"file\" accept=\".json,application/json\">\u003c/label>\u003cbutton id=\"printYear\">🖨️ Skriv ut / lagre som PDF\u003c/button>\u003cbutton id=\"installApp\" hidden>📱 Installer app\u003c/button>\u003c/div>\u003cp class=\"help\">Eksporten inneholder personlige valg, ferie og merkedager. Oppbevar filen privat. Import erstatter eksisterende valg. For installasjon på hjemskjermen må appen publiseres via HTTPS med de tilhørende PWA-filene. Åpning som lokal HTML-fil støtter ikke full PWA-installasjon.\u003c/p>\u003c/section>\n\u003cdiv id=\"printHeading\" class=\"print-only\">\u003c/div>\u003cdiv class=\"toolbar\" id=\"calendarToolbar\">\u003ch2>Årsoversikt\u003c/h2>\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"dot green\">\u003c/i>Fri (O/X/T, ev. H)\u003c/span>\u003cspan>\u003ci class=\"dot work\">\u003c/i>Vakt / Dag2\u003c/span>\u003cspan>\u003ci class=\"dot vac\">\u003c/i>Ferie\u003c/span>\u003c/div>\u003c/div>\u003cdiv id=\"months\" class=\"months\">\u003c/div>\u003csection id=\"detail\" class=\"detail\" aria-live=\"polite\">Trykk på en dato for detaljer om vakten.\u003c/section>\u003cdiv class=\"foot\">Grunnlag: K-Hmr 1–3 R27, versjon 16.10.2026. Dag2 vises som egen kode uten grønn fridagsmarkering. Vaktene er hentet fra PDF-grunnlaget; kontroller alltid gjeldende offisiell turnus ved avvik.\u003c/div>\u003cp style=\"margin:15px auto;max-width:1150px;padding:12px;background:#fff4d7\">Merk: K-Hmr3 har fire uker, mens K-Hmr1 og K-Hmr2 har seks.\u003c/p>\u003c/main>\u003cscript>\nconst DATA=[[[{\"code\":\"O\",\"time\":\"\"},{\"code\":\"38R1800\",\"time\":\"18:00-02:00\"},{\"code\":\"38R1800\",\"time\":\"18:00-02:00\"},{\"code\":\"Dag2\",\"time\":\"\"},{\"code\":\"38H1100\",\"time\":\"11:00-20:00\"},{\"code\":\"38R1530\",\"time\":\"15:30-23:00\"},{\"code\":\"38R1130\",\"time\":\"11:30-20:00\"}],[{\"code\":\"38R0700\",\"time\":\"07:00-16:00\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"382591\",\"time\":\"17:30-07:51\"},{\"code\":\"382593\",\"time\":\"19:37-09:53\"},{\"code\":\"Dag2\",\"time\":\"\"},{\"code\":\"X\",\"time\":\"\"},{\"code\":\"O\",\"time\":\"\"}],[{\"code\":\"O\",\"time\":\"\"},{\"code\":\"382581\",\"time\":\"07:27-16:01\"},{\"code\":\"382589\",\"time\":\"15:37-19:46\"},{\"code\":\"382 e)||(state.hfree&&code.includes('H'))||onVacation(d)){\n    previous=null;continue;\n   }\n   if(!(previous&&attendanceLinksOverview.has(previous+'|'+code)))count++;\n   previous=code;\n  }\n }\n return count;\n}\nfunction render(){let html='',off=0,work=0,h=0,vac=0,redFree=0;for(let d=startUTC;d\u003c=endUTC;d+=MS){let e=entry(d);let free=isFree(e)||(e.code==='Dag2'&&dag2Fri(d)),holiday=onVacation(d);if(free||holiday)off++;else work++;if(e.code.includes('H'))h++;if(holiday)vac++;if(HOLIDAYS.has(iso(d))&&iso(d)!=='2027-03-28'&&isFree(e))redFree++}\n$('daysOff').textContent=off;$('workDays').textContent=work;$('attendanceTop').textContent=attendanceCountOverview();$('vacDays').textContent=vac;$('hDays').textContent=h;$('redFreeDays').textContent=redFree;\nfor(let monthIndex=0;monthIndex\u003c13;monthIndex++){let year=monthIndex===0?2026:2027,month=monthIndex===0?11:monthIndex-1;let first=Date.UTC(year,month,1),last=Date.UTC(year,month+1,0);let title=new Date(first).toLocaleDateString('nb-NO',{month:'long',year:'numeric',timeZone:'UTC'});html+='\u003carticle class=\"month\">\u003ch3>'+title[0].toUpperCase()+title.slice(1)+'\u003c/h3>\u003cdiv class=\"weekdays\">'+['M','T','O','T','F','L','S'].map(x=>'\u003cspan>'+x+'\u003c/span>').join('')+'\u003c/div>\u003cdiv class=\"days\">';let offset=(new Date(first).getUTCDay()+6)%7;for(let k=0;k\u003coffset;k++)html+='\u003cdiv class=\"cell empty\">\u003c/div>';for(let d=first;d\u003c=last;d+=MS){let e=entry(d);if(!e){html+='\u003cdiv class=\"cell empty\">\u003c/div>';continue}let free=isFree(e)||(e.code==='Dag2'&&dag2Fri(d)),v=onVacation(d),s=iso(d),shownCode=(e.code==='Dag2'&&dag2Fri(d)?'Fri':e.code);html+='\u003cdiv role=\"button\" tabindex=\"0\" class=\"cell '+(free?'off ':'')+(v?'vacation ':'')+(HOLIDAYS.has(s)?'holiday':'')+'\" data-date=\"'+s+'\" title=\"'+s+' · '+shownCode+' '+e.time+(e.extraShifts||[]).map(x=>' / '+x.code+' '+x.time).join('')+'\">\u003cdiv class=\"num\">'+new Date(d).getUTCDate()+'\u003c/div>\u003cdiv class=\"code '+(e.code.includes('R')?'r-duty':'')+'\">'+shownCode+'\u003c/div>\u003cdiv class=\"time\">'+e.time+'\u003c/div>'+(e.extraShifts||[]).map(x=>'\u003cdiv class=\"code\" style=\"margin-top:5px;border-top:1px solid #aac4d6;padding-top:4px\">'+x.code+'\u003c/div>\u003cdiv class=\"time\">'+x.time+'\u003c/div>').join('')+''+(v?'\u003cspan class=\"badge\">Ferie\u003c/span>':'')+'\u003c/div>'}html+='\u003c/div>\u003c/article>'} $('months').innerHTML=html;\n$('vaclist').innerHTML=state.vacations.length?state.vacations.map((v,i)=>'\u003cspan class=\"vacitem\">'+dateLabel(v.from)+' – '+dateLabel(v.to)+' \u003cbutton aria-label=\"Slett ferie\" data-remove=\"'+i+'\">×\u003c/button>\u003c/span>').join(''):'\u003cspan class=\"muted\">Ingen ferie registrert ennå.\u003c/span>';\n}\nfor(let i=1;i\u003c=3;i++)$('roster').add(new Option('Turnus '+i,i));function syncStartWeeks(){let el=$('start'),n=DATA[state.roster-1].length;el.innerHTML='';for(let i=1;i\u003c=n;i++)el.add(new Option('Uke '+i,i));if(state.start>n)state.start=1;el.value=state.start;}syncStartWeeks();$('roster').value=state.roster;$('start').value=state.start;$('hfree').checked=state.hfree;\n$('roster').onchange=e=>{state.roster=+e.target.value;syncStartWeeks();save();render()};$('start').onchange=e=>{state.start=+e.target.value;save();render()};$('hfree').onchange=e=>{state.hfree=e.target.checked;save();render()};\n$('addvac').onclick=()=>{let a=$('from').value,b=$('to').value;if(!a||!b||a>b||a\u003c'2026-12-14'||b>'2027-12-12'){alert('Velg gyldige datoer innenfor turnusåret.');return}state.vacations.push({from:a,to:b});state.vacations.sort((a,b)=>a.from.localeCompare(b.from));save();render()};\n$('clearvac').onclick=()=>{if(confirm('Vil du slette alle dine registrerte ferieperioder?')){state.vacations=[];save();render()}};\n$('reset').onclick=()=>{if(confirm('Nullstille turnusvalg og ferieperioder på denne enheten?')){state={roster:1,start:1,hfree:false,vacations:[]};save();location.reload()}};\n$('vaclist').onclick=e=>{let b=e.target.closest('[data-remove]');if(b){state.vacations.splice(+b.dataset.remove,1);save();render()}};\nfunction showDetail(el){let s=el.dataset.date,d=Date.parse(s+'T00:00:00Z'),e=entry(d),isDag2Fri=e.code==='Dag2'&&dag2Fri(d),shownCode=isDag2Fri?'Fri':e.code;$('detail').textContent=dateLabel(s)+' · Turnus '+state.roster+', uke '+e.week+' · '+shownCode+(e.time?' · '+e.time:'')+(e.extraShifts||[]).map(x=>' · '+x.code+' · '+x.time).join('')+' · '+(isFree(e)||isDag2Fri?'Fridag':e.code==='Dag2'?'Dag 2 – arbeidsdag':'Vanlig markering')+(onVacation(d)?' · Ferie registrert':'')}\n$('months').addEventListener('click',e=>{let el=e.target.closest('[data-date]');if(el)showDetail(el)});$('months').addEventListener('keydown',e=>{if(e.key==='Enter'){let el=e.target.closest('[data-date]');if(el)showDetail(el)}});render();\n\u003c/script>\u003cscript>\n(function(){\n'use strict';\nstate.important=Array.isArray(state.important)?state.important:[];\nconst get=id=>document.getElementById(id), dayMs=86400000;\nconst safe=t=>String(t).replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst dateUTC=s=>Date.parse(s+'T00:00:00Z');\nconst allDates=[];for(let d=startUTC;d\u003c=endUTC;d+=dayMs)allDates.push(d);\nfunction datum(roster,week,d){let n=dayNumber(d);return DATA[roster-1][(week-1+Math.floor(n/7))%DATA[roster-1].length][n%7]}\nfunction free(e){return ['O','X','T'].includes(e.code)||(state.hfree&&e.code.includes('H'))}\nfunction vacation(d){return onVacation(d)}\nfunction duty(e,d){return !free(e)&&!(e.code==='Dag2'&&dag2FriFor(d))&&!vacation(d)}\nfunction hm(time){return time?Number(time.slice(0,2))*60+Number(time.slice(3,5)):null}\nfunction limits(){return {early:hm(get('earlyLimit').value)??420,late:hm(get('lateLimit').value)??840,nightFrom:hm(get('nightFrom').value)??80,nightTo:hm(get('nightTo').value)??285}}\nfunction coversNight(a,b,from,to){if(a===null||b===null||from===to)return false;let end=b\u003c=a?b+1440:b;for(let k=-1;k\u003c=1;k++){let start=from+k*1440,finish=to+k*1440+(to\u003c=from?1440:0);if(a\u003c=start&&end>=finish)return true}return false}\nconst nightSettingsKey='turnusvelger-r27-mosjoen-night-range';try{let z=JSON.parse(localStorage.getItem(nightSettingsKey)||'null');if(z&&/^([01]\\d|2[0-3]):[0-5]\\d$/.test(z.from)&&/^([01]\\d|2[0-3]):[0-5]\\d$/.test(z.to)){get('nightFrom').value=z.from;get('nightTo').value=z.to}}catch(e){}\nconst attendanceLinks=new Set([\"382595P|382511\", \"382589|382511\", \"382591|382580\", \"382593|382586\", \"382589|382586\"]);\nfunction attendanceCount(roster,week){\n let count=0,previous=null;\n for(const d of allDates){\n  const e=datum(roster,week,d),items=Array.isArray(e)?e:[e];\n  for(const item of items){\n   const code=String(item?.code||'').trim();\n   if(!code||code==='Dag2'||!duty(item,d)){previous=null;continue}\n   if(!(previous&&attendanceLinks.has(previous+'|'+code)))count++;\n   previous=code;\n  }\n }\n return count;\n}\nfunction analyze(roster,week){let r={off:0,work:0,comp:0,h:0,early:0,late:0,night:0,rDuty:0,weekendWork:0,weekendFree:0,weekendFreeDays:0,markedFree:0,markedTotal:state.important.length,attendance:attendanceCount(roster,week)};let {early,late,nightFrom,nightTo}=limits();let weekends={};for(let d of allDates){let e=datum(roster,week,d),f=free(e),v=vacation(d),s=iso(d);if(f||v||(e.code==='Dag2'&&dag2FriFor(d)))r.off++;else r.work++;if(e.code.includes('H'))r.h++;if(HOLIDAYS.has(s)&&f)r.comp++;if(state.important.some(m=>m.date===s)&&(f||v))r.markedFree++;\nlet wd=new Date(d).getUTCDay();if(wd===6||wd===0){let monday=d-((wd+6)%7)*dayMs;let key=iso(monday);if(!weekends[key])weekends[key]=0;if(duty(e,d))weekends[key]++;else r.weekendFreeDays++}\nif(duty(e,d)){let times=e.time.split('-');if(times.length===2){let a=hm(times[0]),b=hm(times[1]);if(a\u003cearly)r.early++;if(b>late)r.late++;if(e.code!=='527177A' && coversNight(a,b,nightFrom,nightTo))r.night++}if(e.code.includes('R'))r.rDuty++}}\nfor(let count of Object.values(weekends)){if(count)r.weekendWork+=count;else r.weekendFree++}return r}\nfunction metric(label,n){return '\u003cspan class=\"mini-stat\">\u003cb>'+safe(label)+':\u003c/b> '+n+'\u003c/span>'}\nfunction fillSelect(id,n,label){let el=get(id);for(let i=1;i\u003c=n;i++)el.add(new Option(label+i,i))}\nfillSelect('cmpRosterA',3,'Turnus ');fillSelect('cmpRosterB',3,'Turnus ');fillSelect('cmpWeekA',6,'Uke ');fillSelect('cmpWeekB',6,'Uke ');\nget('cmpRosterA').value=state.roster;get('cmpWeekA').value=state.start;get('cmpRosterB').value=state.roster===3?1:state.roster+1;get('cmpWeekB').value=state.start; if(+get('cmpWeekB').value>DATA[+get('cmpRosterB').value-1].length)get('cmpWeekB').value='1';\nfunction isoWeek(d){let x=new Date(d);x.setUTCHours(0,0,0,0);x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));let year=x.getUTCFullYear();let first=Date.UTC(year,0,1);return {year,week:Math.ceil((((x-first)/dayMs)+1)/7)}}\nfunction weekOverview(roster,week){let h='';for(let d=startUTC;d\u003c=endUTC;d+=7*dayMs){let wn=isoWeek(d),n=dayNumber(d),rw=(week-1+Math.floor(n/7))%DATA[roster-1].length+1;h+='\u003cdiv style=\"margin:9px 0 4px;font-size:12px\">\u003cb>Kalenderuke '+wn.week+'/'+wn.year+'\u003c/b> · turnusuke '+rw+'\u003c/div>\u003cdiv class=\"week-grid\">';for(let k=0;k\u003c7;k++){let dt=d+k*dayMs,e=datum(roster,week,dt),s=iso(dt),mark=state.important.some(m=>m.date===s);h+='\u003cdiv class=\"wkday '+(free(e)?'off ':'')+(vacation(dt)?'vacation ':'')+(HOLIDAYS.has(s)?'holiday ':'')+(e.code.includes('R')?'r-duty':'')+'\" title=\"'+safe(s+' '+e.code+' '+e.time)+'\" '+(mark?'style=\"outline:2px solid #8a50be\"':'')+'>'+new Date(dt).getUTCDate()+'.'+(new Date(dt).getUTCMonth()+1)+'\u003cbr>\u003cb>'+safe(e.code)+'\u003c/b>\u003c/div>'}h+='\u003c/div>'}return h}\nfunction comparison(){for(let side of ['A','B']){let r=+get('cmpRoster'+side).value,w=get('cmpWeek'+side),limit=DATA[r-1].length;for(let o of w.options)o.disabled=+o.value>limit;if(+w.value>limit)w.value='1'}let a=+get('cmpRosterA').value,aw=+get('cmpWeekA').value,b=+get('cmpRosterB').value,bw=+get('cmpWeekB').value,x=analyze(a,aw),y=analyze(b,bw);let names=[['Vaktdager','work'],['Fridager','off'],['Kompdager','comp'],['H-dager','h'],['Arbeidsdager helg','weekendWork'],['Frihelger','weekendFree'],['Tidligvakter','early'],['Senvakter','late'],['Nattvakter','night'],['R-vakter','rDuty'],['Private merkedager fri','markedFree']];get('comparisonResult').innerHTML='\u003ctable class=\"comparison-table\">\u003cthead>\u003ctr>\u003cth>Statistikk\u003c/th>\u003cth>Turnus '+a+' / uke '+aw+'\u003c/th>\u003cth>Turnus '+b+' / uke '+bw+'\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+names.map(([label,key])=>'\u003ctr>\u003ctd>'+label+'\u003c/td>\u003ctd>'+x[key]+'\u003c/td>\u003ctd>'+y[key]+'\u003c/td>\u003c/tr>').join('')+'\u003c/tbody>\u003c/table>\u003ch3>Uke-for-uke-kalender\u003c/h3>\u003cdiv class=\"comparison\">\u003cdiv class=\"compare-col\">\u003cb>Turnus '+a+' – uke '+aw+'\u003c/b>'+weekOverview(a,aw)+'\u003c/div>\u003cdiv class=\"compare-col\">\u003cb>Turnus '+b+' – uke '+bw+'\u003c/b>'+weekOverview(b,bw)+'\u003c/div>\u003c/div>'}\n\n// Foreløpig beregning: bare eksplisitt koblede Fra/Til-vakter på påfølgende dager.\n// Dette er oppholdstimer, IKKE et verifisert lønnstillegg i kroner.\nfunction layoverSummary(roster,week){\n let minutes=0,stays=0,rows=[],prev=null;\n const links=(typeof attendanceLinks!=='undefined'?attendanceLinks:linkedDuties);\n for(const d of allDates){\n  const e=datum(roster,week,d),items=Array.isArray(e)?e:[e];\n  for(const item of items){\n   const code=String(item?.code||'').trim();\n   if(!code||code==='Dag2'||!duty(item,d)){prev=null;continue}\n   const t=String(item.time||'').match(/^(\\d\\d:\\d\\d)-(\\d\\d:\\d\\d)$/);\n   const start=t?hm(t[1]):null,end=t?hm(t[2]):null;\n   if(prev&&links.has(prev.code+'|'+code)&&d-prev.date===dayMs&&start!==null&&prev.end!==null){\n    // End of outbound duty may be after midnight. The return duty starts next day.\n    const gap=1440+start-prev.end;\n    if(gap>0&&gap\u003c=1440){\n     minutes+=gap;stays++;\n     rows.push({date:iso(prev.date),out:prev.code,back:code,minutes:gap});\n    }\n   }\n   prev={date:d,code,end:end===null?null:end+(start!==null&&end\u003cstart?1440:0)};\n  }\n }\n // A-DelDU: green interval in the official strekliste; A-DelDH excluded.\n const delduRules=[{\"code\":\"382583\",\"days\":[6],\"from\":\"13:49\",\"to\":\"16:10\",\"minutes\":141,\"page\":8},{\"code\":\"382591\",\"days\":[1,2,3,4],\"from\":\"21:50\",\"to\":\"04:05\",\"minutes\":375,\"page\":9},{\"code\":\"382591\",\"days\":[0],\"from\":\"21:50\",\"to\":\"04:05\",\"minutes\":375,\"page\":9},{\"code\":\"382593\",\"days\":[1,2,3,4],\"from\":\"23:44\",\"to\":\"06:05\",\"minutes\":381,\"page\":9},{\"code\":\"382593\",\"days\":[0],\"from\":\"23:46\",\"to\":\"06:05\",\"minutes\":379,\"page\":9}];\n for(const d of allDates){\n  const wd=new Date(d).getUTCDay();\n  const e=datum(roster,week,d),items=Array.isArray(e)?e:[e];\n  for(const item of items){\n   const code=String(item?.code||'').trim();\n   if(!duty(item,d))continue;\n   const rule=delduRules.find(x=>x.code.toUpperCase()===code.toUpperCase()&&x.days.includes(wd));\n   if(!rule)continue;\n   minutes+=rule.minutes;stays++;\n   rows.push({date:iso(d),out:code,back:'A-DelDU',minutes:rule.minutes,split:true});\n  }\n }\n return {minutes,stays,rows};\n}\nfunction layoverStats(){\n const r=layoverSummary(state.roster,state.start);\n const fmt=n=>(n/60).toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2});\n const monthly={};\n for(const x of r.rows){const month=x.date.slice(0,7);if(!monthly[month])monthly[month]={ordinary:0,split:0};monthly[month][x.split?'split':'ordinary']+=x.minutes;}\n const monthRows=Object.entries(monthly).sort(([a],[b])=>a.localeCompare(b)).map(([month,v])=>'\u003ctr>\u003ctd>'+safe(month)+'\u003c/td>\u003ctd>'+fmt(v.ordinary)+'\u003c/td>\u003ctd>'+fmt(v.split)+'\u003c/td>\u003c/tr>').join('');\n const details=r.rows.map(x=>'\u003ctr>\u003ctd>'+safe(x.date)+'\u003c/td>\u003ctd>'+safe(x.out)+'\u003c/td>\u003ctd>'+safe(x.back)+'\u003c/td>\u003ctd>'+Math.floor(x.minutes/60)+' t '+String(x.minutes%60).padStart(2,'0')+' min\u003c/td>\u003c/tr>').join('');\n return '\u003cdiv style=\"margin-top:20px\">\u003ch3>🏨 Oppholdstillegg – utestasjon\u003c/h3>'+\n '\u003cp>\u003cstrong>Oppholdstillegg totalt: '+fmt(r.minutes)+' timer\u003c/strong> (inkludert registrerte delte dagsverk på utestasjon) · '+r.stays+' registrerte opphold.\u003c/p>'+\n '\u003cp class=\"hint\">Viser antall timer som grunnlag for prosenttillegg av din egen timelønn, på samme måte som natt- og helgetillegg. Ingen timelønn eller prosentsats er nødvendig. Beregningen bygger på kjente Fra/Til-koblinger på påfølgende dager og er foreløpig ikke komplett kvalitetssikret mot strekklisten. Ferie og H=fri tas hensyn til.\u003c/p>'+\n '\u003ctable class=\"comparison-table\">\u003cthead>\u003ctr>\u003cth>Måned (første dagsverk)\u003c/th>\u003cth>Opphold (timer)\u003c/th>\u003cth>Delt dagsverk (timer)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+monthRows+'\u003c/tbody>\u003c/table>'+\n (details?'\u003cdetails style=\"margin-top:12px\">\u003csummary>Vis de '+r.stays+' beregnede oppholdene\u003c/summary>\u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"comparison-table\">\u003cthead>\u003ctr>\u003cth>Dato\u003c/th>\u003cth>Til-vakt\u003c/th>\u003cth>Fra-vakt\u003c/th>\u003cth>Opphold\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+details+'\u003c/tbody>\u003c/table>\u003c/div>\u003c/details>':'\u003cp class=\"hint\">Ingen opphold funnet med de registrerte koblingene.\u003c/p>')+'\u003c/div>';\n}\nfunction statistics(){let r=analyze(state.roster,state.start);get('extraStats').innerHTML=metric('Antall oppmøter',r.attendance)+metric('Tidligvakter',r.early)+metric('Senvakter',r.late)+metric('Nattvakter',r.night)+metric('Arbeidsdager helg',r.weekendWork)+metric('Frihelger',r.weekendFree)+metric('R-vak
